<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>坎公美术资源管理器</title>
  <style>
    :root {
      --bg: #0f1116;
      --panel: #161a21;
      --panel-2: #1c212a;
      --panel-3: #232936;
      --line: #252b35;
      --line-2: #303845;
      --text: #e8ebf1;
      --dim: #9aa3b3;
      --mute: #6b7484;
      --accent: #6d8fd4;
      --accent-2: #93aee6;
      --accent-dim: rgba(109, 143, 212, .15);
      --accent-line: rgba(109, 143, 212, .40);
      --r: 10px;
      --rs: 7px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.55 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: #2b323e;
      border: 3px solid transparent;
      background-clip: content-box;
      border-radius: 6px;
    }
    ::-webkit-scrollbar-thumb:hover { background: #3a4350; background-clip: content-box; }
    ::-webkit-scrollbar-corner { background: transparent; }

    .app { display: flex; flex-direction: column; height: 100vh; }

    /* ---------------- 资源列表（搜索 + 选择合一） ---------------- */
    .asset-list {
      max-height: 300px;
      overflow-y: auto;
      margin: 0 -5px;
      padding: 2px 5px;
    }

    .asset-item {
      display: flex;
      align-items: center;
      gap: 7px;
      width: 100%;
      text-align: left;
      padding: 4px 7px;
      margin: 0 0 2px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      line-height: 1.35;
    }

    .asset-item:hover { background: #1b212a; border-color: var(--line); }
    .asset-item.on { background: var(--accent-dim); border-color: var(--accent-line); }
    .asset-item.cursor { background: #232b38; border-color: var(--line-2); }

    /* 缩略图仅绘制帧内像素，非正方形帧的其余区域保持透明。 */
    .asset-item .thumb {
      flex: none;
      width: 30px;
      height: 30px;
      border-radius: 4px;
      background-color: #0d1014;
      background-repeat: no-repeat;
      image-rendering: pixelated;
      cursor: inherit;
    }

    .equipped-list { list-style: none; padding: 0; margin: 8px 0 0; }
    .equipped-row { display: flex; align-items: center; gap: 7px; padding: 8px 0; border-top: 1px solid var(--line); }
    .equipped-row .asset-text { flex: 1; min-width: 0; }
    .equipped-row .zh { display: block; color: var(--text); }
    .equipped-row .code, .equipped-row .mount { display: block; font-size: 10.5px; color: var(--dim); overflow-wrap: anywhere; }
    .equipped-row .thumb { flex: none; width: 30px; height: 30px; background: #0d1014; image-rendering: pixelated; cursor: default; }

    .asset-item .asset-text { flex: 1 1 auto; min-width: 0; }

    .asset-item .zh {
      display: block;
      font-size: 12px;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .asset-item.on .zh { color: var(--accent-2); }

    .asset-item .code {
      display: block;
      font-size: 10.5px;
      color: var(--mute);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .asset-more { margin-top: 7px; font-size: 11px; color: var(--mute); }

    /* 仅在载入时出现的轻提示；预留高度，出现/消失都不会让下面的列表跳动 */
    .loading-hint {
      min-height: 16px;
      margin: 2px 0 2px;
      font-size: 11.5px;
      color: var(--accent-2);
      visibility: hidden;
    }

    .loading-hint.on { visibility: visible; }

    /* ---------------- 布局 ---------------- */
    .layout { flex: 1 1 auto; display: flex; min-height: 0; }

    .stage {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      background: radial-gradient(120% 120% at 50% 0%, #171c24 0%, #0e1014 70%);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #111;
      cursor: grab;
    }

    canvas:active { cursor: grabbing; }

    /* ---------------- 导出范围预览框 ----------------
       框体和内部对鼠标透明（事件穿透到画布，不影响正常拖动/缩放）；
       只有 8 个手柄（四角+四边中点）负责拉伸，边上其余位置负责平移。 */
    .region {
      position: absolute;
      left: 0; top: 0; width: 0; height: 0;
      border: 1px dashed var(--accent-2);
      box-shadow: 0 0 0 9999px rgba(6, 8, 11, .55);
      pointer-events: none;
      z-index: 1;
    }

    .region .edge {
      position: absolute;
      pointer-events: auto;
      cursor: move;
    }

    .region .edge.top { left: 11px; right: 11px; top: -4px; height: 8px; }
    .region .edge.bottom { left: 11px; right: 11px; bottom: -4px; height: 8px; }
    .region .edge.left { top: 11px; bottom: 11px; left: -4px; width: 8px; }
    .region .edge.right { top: 11px; bottom: 11px; right: -4px; width: 8px; }

    .region .h {
      position: absolute;
      width: 10px; height: 10px;
      margin: -6px 0 0 -6px;
      background: var(--accent-2);
      border: 2px solid #10131a;
      border-radius: 3px;
      pointer-events: auto;
    }

    .region .h.nw { left: 0; top: 0; cursor: nwse-resize; }
    .region .h.n { left: 50%; top: 0; cursor: ns-resize; }
    .region .h.ne { left: 100%; top: 0; cursor: nesw-resize; }
    .region .h.e { left: 100%; top: 50%; cursor: ew-resize; }
    .region .h.se { left: 100%; top: 100%; cursor: nwse-resize; }
    .region .h.s { left: 50%; top: 100%; cursor: ns-resize; }
    .region .h.sw { left: 0; top: 100%; cursor: nesw-resize; }
    .region .h.w { left: 0; top: 50%; cursor: ew-resize; }

    /* ------------- 选中组件的画布标注（组件名） -------------
       只为「标注」而存在：pointer-events:none，不挡画布上的拖动、滚轮和导出框手柄。 */
    .slot-tag {
      position: absolute;
      left: 0; top: 0;
      z-index: 2;
      display: none;
      padding: 2px 8px;
      font-size: 11px;
      line-height: 1.5;
      color: #0d1117;
      background: var(--accent-2);
      border-radius: 999px;
      white-space: nowrap;
      pointer-events: none;
      transform: translate(-50%, -100%);
      box-shadow: 0 1px 6px rgba(0, 0, 0, .5);
    }

    .slot-tag.on { display: block; }

    /* ---------------- 侧栏 ---------------- */
    .sidebar {
      flex: none;
      width: 336px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
      overflow-y: auto;
      background: #12151b;
      border-left: 1px solid var(--line);
    }

    .card {
      flex: none;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 12px;
    }

    .card > h3 {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 11px;
      font-size: 10.5px;
      font-weight: 650;
      letter-spacing: .13em;
      text-transform: uppercase;
      color: var(--mute);
    }

    .card > h3 .badge { margin-left: auto; }

    /* ---------------- 控件 ---------------- */
    label.field {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 9px;
      color: var(--dim);
      font-size: 12px;
    }

    label.field:last-child { margin-bottom: 0; }
    label.field > span { flex: none; min-width: 46px; }
    label.field > select,
    label.field > input[type=text],
    label.field > .grow { flex: 1 1 auto; min-width: 0; }

    select,
    input[type=text],
    input[type=number] {
      width: 100%;
      min-width: 0;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: var(--rs);
      padding: 6px 8px;
      font: inherit;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    select:hover, input[type=text]:hover, input[type=number]:hover { border-color: var(--line-2); }

    select:focus, input[type=text]:focus, input[type=number]:focus {
      border-color: var(--accent-line);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    input:disabled { opacity: .5; }

    input[type=color] {
      width: 100%;
      height: 30px;
      padding: 2px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: var(--rs);
      cursor: pointer;
    }

    input[type=checkbox] { accent-color: var(--accent); width: 14px; height: 14px; margin: 0; cursor: pointer; }

    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 18px;
      margin: 0;
      background: transparent;
      cursor: pointer;
    }

    input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: var(--panel-3); }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px; height: 13px;
      margin-top: -4.5px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid #10131a;
      box-shadow: 0 0 0 1px var(--accent-line);
    }

    input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--panel-3); }

    input[type=range]::-moz-range-thumb {
      width: 11px; height: 11px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid #10131a;
    }

    button {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: var(--rs);
      padding: 6px 11px;
      font: inherit;
      cursor: pointer;
      transition: background .15s, border-color .15s, transform .06s;
      white-space: nowrap;
    }

    button:hover:not(:disabled) { background: var(--panel-3); border-color: var(--line-2); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: .45; cursor: not-allowed; }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #0d1117;
      font-weight: 620;
    }

    button.primary:hover:not(:disabled) { background: var(--accent-2); border-color: var(--accent-2); }

    button.tiny { padding: 4px 9px; font-size: 11.5px; }

    .badge {
      flex: none;
      font-size: 10.5px;
      font-variant-numeric: tabular-nums;
      color: var(--mute);
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 1px 8px;
      white-space: nowrap;
    }

    .row { display: flex; align-items: center; gap: 7px; }
    .row + .row { margin-top: 7px; }

    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid2 label.field { margin-bottom: 0; }
    .grid2 label.field > span { min-width: 30px; }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 9px;
      font-size: 12px;
      color: var(--dim);
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 7px;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    .chip:hover { color: var(--text); border-color: var(--line-2); }

    /* ---------------- 轨道 ---------------- */
    .track { display: grid; grid-template-columns: 48px 1fr; align-items: center; gap: 8px; margin-bottom: 9px; }
    .track:last-child { margin-bottom: 0; }
    .track > span { font-size: 11.5px; color: var(--mute); }

    /* ---------------- 组件列表 ---------------- */
    .slot-list { max-height: 300px; overflow-y: auto; margin: 0 -5px; padding: 2px 5px; }

    .slot-control {
      display: grid;
      grid-template-columns: 16px minmax(0, 1fr) 84px 34px;
      align-items: center;
      gap: 8px;
      padding: 3px 3px;
      border-radius: 6px;
    }

    .slot-control:hover { background: #1b212a; }

    .slot-control > label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11.5px;
      color: var(--dim);
      cursor: pointer;
    }

    .slot-control.off > label { color: #5b6373; text-decoration: line-through; text-decoration-color: rgba(255,255,255,.22); }
    .slot-control.off input[type=range] { opacity: .35; }

    .slot-control.picked { background: var(--accent-dim); box-shadow: inset 0 0 0 1px var(--accent-line); }
    .slot-control.picked > label { color: var(--accent-2); }

    .slot-pct { font-size: 10.5px; color: var(--mute); text-align: right; font-variant-numeric: tabular-nums; }

    /* ---------------- 导出 ---------------- */
    .bar {
      height: 5px;
      margin-top: 10px;
      border-radius: 3px;
      background: var(--panel-3);
      overflow: hidden;
      display: none;
    }

    .bar.on { display: block; }
    .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .12s linear; }

    /* ---------------- 本地资源（内嵌在「资源」卡里，不再是画布上的弹窗） ---------------- */
    .upload { display: none; }
    .upload.on { display: block; }
    .upload label.field > span { min-width: 62px; }

    .upload input[type=file] {
      flex: 1 1 auto;
      min-width: 0;
      font-size: 11px;
      color: var(--dim);
      overflow: hidden;
    }

    @media (max-width: 900px) {
      .layout { flex-direction: column; }
      .sidebar { width: auto; border-left: 0; border-top: 1px solid var(--line); max-height: 52vh; }
      .stage { min-height: 300px; }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="layout">
      <main class="stage" id="stage">
        <canvas id="canvas"></canvas>
        <div class="region" id="exportRegion">
          <span class="edge top" data-edge="top"></span>
          <span class="edge right" data-edge="right"></span>
          <span class="edge bottom" data-edge="bottom"></span>
          <span class="edge left" data-edge="left"></span>
          <span class="h nw" data-dir="nw"></span>
          <span class="h n" data-dir="n"></span>
          <span class="h ne" data-dir="ne"></span>
          <span class="h e" data-dir="e"></span>
          <span class="h se" data-dir="se"></span>
          <span class="h s" data-dir="s"></span>
          <span class="h sw" data-dir="sw"></span>
          <span class="h w" data-dir="w"></span>
        </div>

        <div class="slot-tag" id="slotTag"></div>
      </main>

      <aside class="sidebar">
        <section class="card">
          <h3>资源 <span class="badge" id="assetCount">0</span></h3>
          <label class="field">
            <span>目录</span>
            <select id="folderSelector">
              <option value="illust">illust</option>
              <option value="character">character</option>
              <option value="custom">custom</option>
            </select>
          </label>

          <div class="loading-hint" id="loadingHint">加载中……</div>

          <div id="searchBlock">
            <label class="field">
              <span>搜索</span>
              <input type="text" id="assetSearchBox" placeholder="中文名或内码 · ↑↓ 选择 Enter 载入" autocomplete="off" spellcheck="false">
            </label>
            <div class="asset-list" id="assetList"></div>
            <div class="asset-more" id="assetMore"></div>
          </div>

          <div class="upload" id="customUploadPanel">
            <label class="field"><span>图片 .png</span><input type="file" id="customImage" accept=".png"></label>
            <label class="field"><span>图集 .atlas</span><input type="file" id="customAtlas" accept=".atlas,.txt"></label>
            <label class="field"><span>骨骼 .json</span><input type="file" id="customSkeleton" accept=".json,.bytes"></label>
            <div class="row" style="margin-top:10px">
              <button type="button" id="customLoadBtn" class="primary" style="flex:1 1 auto" disabled>加载动画</button>
            </div>
          </div>
        </section>

        <section class="card">
          <h3>视图</h3>
          <div class="row">
            <button type="button" class="tiny" id="fitBtn">适配窗口</button>
            <button type="button" class="tiny" id="actualSizeBtn">原尺寸</button>
            <label class="chip"><input type="checkbox" id="nearestToggle" checked> 最近邻</label>
            <label class="chip"><input type="checkbox" id="debugToggle"> 骨骼</label>
          </div>
          <label class="field" style="margin-top:10px">
            <span>画布底色</span>
            <input type="color" id="canvasBgColor" value="#111111">
          </label>
        </section>

        <section class="card">
          <h3>显示</h3>
          <div class="row" id="skeletonVariantWrapper" style="display:none; margin-bottom:10px">
            <span>骨骼视角</span>
            <div class="row" id="skeletonVariantButtons" role="group" aria-label="骨骼视角"></div>
          </div>
          <label class="field">
            <span>皮肤</span>
            <select id="skinSelector"></select>
          </label>
          <label class="field">
            <span>缩放</span>
            <div class="row" style="flex:1 1 auto">
              <input type="range" id="scaleSlider" min="0" max="100" step="0.5" value="50" style="flex:1 1 auto">
              <span class="badge" id="scaleValue">×1.00</span>
            </div>
          </label>
          <label class="field">
            <span>速度</span>
            <div class="row" style="flex:1 1 auto">
              <input type="range" id="speedSlider" min="0" max="2" step="0.05" value="1" style="flex:1 1 auto">
              <span class="badge" id="speedValue">×1.00</span>
              <button type="button" class="tiny" id="pauseBtn" title="暂停 / 继续动画">暂停</button>
            </div>
          </label>
        </section>

        <section class="card">
          <h3>动画轨道</h3>
          <div class="track"><span>动作</span><select id="trackAction"></select></div>
          <div class="track"><span>表情</span><select id="trackEmote"></select></div>
          <div class="track"><span>子动画</span><select id="trackSub"></select></div>
        </section>

        <section class="card" id="equipmentPanel" style="display:none">
          <h3>装备物品 <span class="badge" id="itemCount">0</span></h3>
          <label class="field">
            <span>挂点骨骼</span>
            <select id="equipmentSlot" aria-label="挂点骨骼与动画槽位"></select>
          </label>
          <label class="field">
            <span>搜索物品</span>
            <input type="text" id="itemSearch" placeholder="中文名或英文内码" autocomplete="off">
          </label>
          <div class="asset-list" id="itemList"></div>
          <div class="asset-more" id="itemMore"></div>
          <div class="row" style="margin-top:8px">
            <button type="button" class="primary" id="equipBtn" disabled>装备</button>
            <button type="button" class="tiny" id="unequipAllBtn" disabled>脱下全部</button>
          </div>
          <div class="asset-more" id="equipmentStatus" role="status"></div>
          <ul class="equipped-list" id="equippedList" aria-label="已启用挂载列表"></ul>
        </section>

        <section class="card">
          <h3>组件 <span class="badge" id="slotCount">0</span></h3>
          <div class="row" style="margin-bottom:7px">
            <label class="chip">
              <input type="checkbox" id="pickToggle" checked> 点选组件（画布⇄列表）
            </label>
          </div>
          <div class="slot-list" id="slotSliders"></div>
        </section>

        <section class="card">
          <h3>导出 GIF</h3>

          <div class="grid2">
            <label class="field"><span>帧率</span><input type="number" id="exportFps" min="1" max="100" value="30"></label>
            <label class="field"><span>时长</span><input type="number" id="exportDuration" min="0.1" step="0.1" value="3"></label>
          </div>

          <label class="row" style="margin-top:9px; font-size:12px; color:var(--dim)">
            <input type="checkbox" id="exportAutoDuration" checked> 时长自动锁定为动画一周
          </label>

          <div class="row" style="margin-top:9px">
            <span style="font-size:12px;color:var(--dim);min-width:30px">背景</span>
            <input type="color" id="exportBgColor" value="#00ff00" style="flex:0 0 54px">
            <label class="row" style="font-size:12px;color:var(--dim);flex:1 1 auto">
              <input type="checkbox" id="exportTransparentBg"> 透明背景
            </label>
          </div>

          <div style="margin-top:11px; font-size:11.5px; color:var(--mute)">导出范围（可在画布上拖动方框）</div>
          <div class="grid2" style="margin-top:7px">
            <label class="field"><span>X</span><input type="number" id="regionX" min="0" value="0"></label>
            <label class="field"><span>Y</span><input type="number" id="regionY" min="0" value="0"></label>
            <label class="field"><span>宽</span><input type="number" id="regionW" min="1" value="256"></label>
            <label class="field"><span>高</span><input type="number" id="regionH" min="1" value="256"></label>
          </div>
          <div class="row" style="margin-top:8px">
            <button type="button" class="tiny" id="regionFull">整幅画布</button>
            <button type="button" class="tiny" id="regionFit">贴住模型</button>
          </div>

          <div class="row" style="margin-top:11px">
            <button type="button" class="primary" id="recordGifBtn" style="flex:1 1 auto">导出 GIF</button>
          </div>
          <div class="bar" id="exportBar"><i></i></div>
        </section>
      </aside>
    </div>
  </div>

  <script src="spine-webgl.js"></script>
  <script src="equipment.js"></script>
  <script src="emotion.js"></script>
  <script>
    (function () {
      "use strict";

      // =====================================================================
      // 常量
      // =====================================================================

      // 数据版本：与 E:\GTFiles\{illust,character}_<版本> 对应。
      // 每次重新生成 assets/ 后必须改这里，否则浏览器会吃旧缓存的 assets.js。
      var DATA_VERSION = "261004-2";
      var QUERY = "?v=" + DATA_VERSION;

      // 新旧导出的后缀都接受，索引小的优先。
      var ATLAS_EXT = [".atlas", ".atlas.txt"];
      var BYTES_EXT = [".bytes", ".skel.bytes"];
      var PNG_EXT = [".png", ".rgba4444.png"];

      var VARIANT_LABEL = { "": "默认", front: "正面", back: "背面", side: "侧面", tentacle: "触手" };
      var VARIANT_ORDER = { "": 0, front: 1, back: 2, side: 3, tentacle: 4 };
      // 没有视角表时，canonical 数据一律是 front/back/side 三视角。
      var DEFAULT_VARIANTS = ["front", "back", "side"];

      var SCALE_MIN = Math.pow(2, -6.25);
      var SCALE_MAX = Math.pow(2, 6.25);
      var FIT_MARGIN = 0.92;

      var $ = function (id) { return document.getElementById(id); };

      var canvas = $("canvas");
      var stage = $("stage");
      var gl = canvas.getContext("webgl", { alpha: true, premultipliedAlpha: true, antialias: false })
        || canvas.getContext("experimental-webgl", { alpha: true });

      if (!gl) {
        document.body.innerHTML = '<p style="padding:24px;font:14px sans-serif;color:#e8ebf1">'
          + '当前浏览器不支持 WebGL，无法预览 Spine 动画。</p>';
        return;
      }

      var renderer = new spine.webgl.SceneRenderer(canvas, gl);

      var app = {
        folder: "illust",
        all: [],
        shown: [],
        variants: {},
        loadToken: 0,
        skeleton: null,
        animState: null,
        tracks: { action: "", emote: "", sub: "" },
        opacity: {},
        enabled: {},
        pickEnabled: true,
        slotRows: [],
        zh: {},
        current: null,
        cursor: -1,
        listLimit: 20,
        variant: "",
        emotionData: null, emotionLoading: null, emotion: null,
        expressionByCharacter: Object.create(null), expressionCatalog: Object.create(null),
        sheets: {},
        itemSheet: null,
        selectedItem: null,
        itemLimit: 20,
        equipment: null,
        equipmentByCharacter: Object.create(null),
        model: null,
        pendingTarget: null,
        pendingSkinTier: null,
        paused: false,
        nearest: true,
        debug: false,
        pos: { x: 0, y: 0 },
        scale: 1,
        region: { x: 0, y: 0, w: 0, h: 0 },
        viewTouched: false,
        refitTimer: 0,
        dragging: false,
        dragAt: { x: 0, y: 0 },
        regionDrag: null,
        exporting: false,
        exportFpsTarget: 30,
        cache: {},
        activeKey: null,
        picked: null,
        forced: {},
        downAt: { x: 0, y: 0 }
      };

      // =====================================================================
      // 小工具
      // =====================================================================

      function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

      function scaleToSlider(scale) { return clamp(50 + 8 * Math.log2(scale), 0, 100); }
      function sliderToScale(value) { return clamp(Math.pow(2, (value - 50) / 8), SCALE_MIN, SCALE_MAX); }

      function suffixUrls(prefix, extensions) {
        var out = [];
        for (var i = 0; i < extensions.length; i++) out.push(prefix + extensions[i] + QUERY);
        return out;
      }

      function unique(urls) {
        var out = [];
        for (var i = 0; i < urls.length; i++) if (out.indexOf(urls[i]) < 0) out.push(urls[i]);
        return out;
      }

      // 图集文本里的页名：非缩进、以 .png 结尾、且下一行是 size: 的行。
      function parseAtlasPages(text) {
        var lines = text.split(/\r?\n/);
        var pages = [];
        for (var i = 0; i < lines.length; i++) {
          var line = lines[i];
          var trimmed = line.trim();
          if (!trimmed || /^\s/.test(line) || !/\.png$/i.test(trimmed)) continue;
          for (var j = i + 1; j < Math.min(i + 4, lines.length); j++) {
            var next = lines[j].trim();
            if (!next) continue;
            if (next.indexOf("size:") === 0) pages.push(trimmed);
            break;
          }
        }
        return pages;
      }

      // =====================================================================
      // 资源加载
      // =====================================================================

      function tryEach(urls, attempt) {
        var index = 0;
        function step() {
          if (index >= urls.length) return Promise.reject(new Error("全部候选地址均不可用: " + urls.join(" , ")));
          var url = urls[index++];
          return attempt(url).catch(function (err) {
            if (err && err.name === "AbortError") throw err;   // 被新的一次切换取消，别再试下一个
            if (index >= urls.length) throw err;
            return step();
          });
        }
        return step();
      }

      // file:// 下 fetch 的 status 是 0，此时 ok 为 false 但不是错误 —— 放行，
      // 这样用 --allow-file-access-from-files 直接开本地文件也能用（完全不走 HTTP）。
      function checkResponse(res, url) {
        if (res.status && !res.ok) throw new Error(url + " " + res.status);
        return res;
      }

      function fetchText(urls, signal) {
        return tryEach(urls, function (url) {
          return fetch(url, signal ? { signal: signal } : undefined)
            .then(function (res) { return checkResponse(res, url).text(); });
        });
      }

      function fetchBinary(urls, signal) {
        return tryEach(urls, function (url) {
          return fetch(url, signal ? { signal: signal } : undefined)
            .then(function (res) { return checkResponse(res, url).arrayBuffer(); });
        });
      }

      // 图片也走 fetch（可被 abort），再交给 <img> 解码 —— 上传路径仍是 texImage2D(<img>)，
      // 与原来完全一致，只是多了一次可取消的下载。
      function loadImage(url, signal) {
        return fetch(url, signal ? { signal: signal } : undefined)
          .then(function (res) { return checkResponse(res, url).blob(); })
          .then(function (blob) {
            app.timing.imgBytes = (app.timing.imgBytes || 0) + blob.size;
            var objectUrl = URL.createObjectURL(blob);
            return new Promise(function (resolve, reject) {
              var img = new Image();
              img.onload = function () {
                var done = function () { URL.revokeObjectURL(objectUrl); resolve(img); };
                // decode() 让浏览器在内部线程完成解码，避免 texImage2D 时把大 PNG 解码砸在主线程上
                if (img.decode) img.decode().then(done, done);
                else done();
              };
              img.onerror = function () {
                URL.revokeObjectURL(objectUrl);
                reject(new Error("图片解码失败: " + url));
              };
              img.src = objectUrl;
            });
          });
      }

      function loadManifest(folder) {
        return new Promise(function (resolve, reject) {
          var previous = $("assetsScript");
          if (previous) previous.remove();
          var script = document.createElement("script");
          script.id = "assetsScript";
          script.src = "assets/" + folder + "/assets.js" + QUERY;
          script.onload = function () { resolve(); };
          script.onerror = function () { reject(new Error("无法加载 assets/" + folder + "/assets.js")); };
          document.head.appendChild(script);
        });
      }

      // 兼容三种清单形态：数组 / 对象数组 / {assets, variants}
      function readManifest() {
        var raw = window.spineAssets;
        var names = [], variants = {};
        function addVariantMap(map) {
          if (!map || typeof map !== "object") return;
          for (var key in map) {
            if (Object.prototype.hasOwnProperty.call(map, key) && Array.isArray(map[key])) {
              variants[key] = map[key].slice();
            }
          }
        }
        if (Array.isArray(raw)) {
          for (var i = 0; i < raw.length; i++) {
            var item = raw[i];
            if (typeof item === "string") names.push(item);
            else if (item && typeof item.name === "string") {
              names.push(item.name);
              if (Array.isArray(item.variants)) variants[item.name] = item.variants.slice();
            }
          }
        } else if (raw && typeof raw === "object") {
          var list = Array.isArray(raw.assets) ? raw.assets : (Array.isArray(raw.names) ? raw.names : []);
          for (var k = 0; k < list.length; k++) {
            if (typeof list[k] === "string") names.push(list[k]);
            else if (list[k] && typeof list[k].name === "string") names.push(list[k].name);
          }
          addVariantMap(raw.variants);
        }
        addVariantMap(window.spineAssetVariants);
        return { names: names, variants: variants };
      }

      function variantsOf(folder, name) {
        if (folder !== "character") return [""];
        var list = app.variants[name];
        if (!list || !list.length) return DEFAULT_VARIANTS.slice();
        return list.slice().sort(function (a, b) {
          var oa = a in VARIANT_ORDER ? VARIANT_ORDER[a] : 9;
          var ob = b in VARIANT_ORDER ? VARIANT_ORDER[b] : 9;
          return oa - ob || (a < b ? -1 : a > b ? 1 : 0);
        });
      }

      function variantLabel(variant) {
        return variant in VARIANT_LABEL ? VARIANT_LABEL[variant] : variant;
      }

      function currentVariant(folder, name) {
        var list = variantsOf(folder, name);
        if (list.length <= 1) return list[0] || "";
        return list.indexOf(app.variant) >= 0 ? app.variant : list[0];
      }

      function refreshVariantSelector(folder, name) {
        var list = variantsOf(folder, name);
        var wrapper = $("skeletonVariantWrapper");
        var buttons = $("skeletonVariantButtons");
        app.variant = currentVariant(folder, name);
        buttons.innerHTML = "";
        for (var i = 0; i < list.length; i++) {
          var button = document.createElement("button");
          button.type = "button";
          button.className = "tiny" + (list[i] === app.variant ? " primary" : "");
          button.dataset.variant = list[i];
          button.setAttribute("aria-pressed", list[i] === app.variant ? "true" : "false");
          button.textContent = variantLabel(list[i]);
          buttons.appendChild(button);
        }
        wrapper.style.display = (folder === "character" && list.length > 1) ? "flex" : "none";
      }

      // =====================================================================
      // 目录 / 资源选择
      // =====================================================================

      // 仅在载入期间出现的轻提示
      function setLoading(on) {
        var hint = $("loadingHint");
        if (hint) hint.classList.toggle("on", !!on);
      }

      function setFolder(folder) {
        app.folder = folder;
        app.model = null;
        $("equipmentPanel").style.display = folder === "character" ? "block" : "none";
        refreshEquipmentPanel();
        if (folder === "character") ensureItems();
        var isCustom = folder === "custom";
        // custom 时用「本地资源」表单顶掉搜索那一块，不再往画布上弹窗
        $("searchBlock").style.display = isCustom ? "none" : "block";
        $("customUploadPanel").classList.toggle("on", isCustom);
        $("skeletonVariantWrapper").style.display = "none";

        if (isCustom) {
          setLoading(false);
          app.all = [];
          app.shown = [];
          app.zh = {};
          app.current = null;
          $("assetSearchBox").value = "";
          renderAssetList();
          return;
        }

        loadManifest(folder).then(function () {
          var manifest = readManifest();
          app.all = manifest.names;
          app.variants = manifest.variants;
          // 中文名 sidecar：拿不到也不影响使用，回落到内码
          return fetch("assets/" + folder + "/names.zh.json" + QUERY)
            .then(function (res) { return res.ok ? res.json() : {}; })
            .catch(function () { return {}; });
        }).then(function (zh) {
          app.zh = zh || {};
          app.current = null;
          $("assetSearchBox").value = "";
          applyFilter();

          // 从 gtatlas 之类外部跳进来的目标：把它顶到列表最前面并选中，
          // 免得它落在首批结果之外、看不到高亮。
          var target = app.pendingTarget;
          app.pendingTarget = null;
          if (target && target.folder === app.folder && target.name) {
            var resolved = resolveTargetName(target.name);
            if (resolved.name && app.all.indexOf(resolved.name) >= 0) {
              app.pendingSkinTier = resolved.tier;
              app.shown = [resolved.name].concat(app.shown.filter(function (n) {
                return n !== resolved.name;
              }));
              renderAssetList();
              selectAsset(resolved.name);
            } else if (window.console && console.debug) {
              console.debug("[gtasset] 跳转目标不在当前清单里:", target.folder, target.name);
            }
          }
          if (app.shown.length && app.current === null) selectAsset(app.shown[0]);
        }).catch(function (err) {
          app.all = [];
          app.shown = [];
          app.zh = {};
          app.current = null;
          renderAssetList();
          window.alert(err.message);
        });
      }

      function displayName(name) {
        return app.zh[name] || name;
      }

      // gtasset 里星阶有两种形态：有的导出成独立资源（admiral_3 在清单里），
      // 有的留在同一个骨骼里当皮肤（adela_noble 的皮肤有 adela_noble_3/4/5）。
      // 所以 GET 收到别处的名字时，先原样试，再逐层还原：
      //   1. 剥掉 gtatlas 的变体后缀 _kong / _circle / _myth
      //      （Kong 区、圆形头像、开花形态 —— 这三个正来自 gtatlas 自己的 SAFE_SUFFIXES，
      //        剥掉不改变名称含义；_ex / _cm 是独立档位，不能剥，剥了会串名）
      //   2. 剥掉星阶 _1~_99，退回基名，并记下星阶交给皮肤去还原
      var VARIANT_SUFFIX_RE = /_(kong|circle|myth)$/;
      var TIER_SUFFIX_RE = /^(.+)_(\d{1,2})$/;

      function resolveTargetName(name) {
        if (!name) return { name: name, tier: null };
        var raw = String(name);
        var candidates = [raw];
        var stripped = raw.replace(VARIANT_SUFFIX_RE, "");
        if (stripped !== raw) candidates.push(stripped);

        for (var i = 0; i < candidates.length; i++) {
          if (app.all.indexOf(candidates[i]) >= 0) return { name: candidates[i], tier: null };
          var m = TIER_SUFFIX_RE.exec(candidates[i]);
          if (m && app.all.indexOf(m[1]) >= 0) return { name: m[1], tier: m[2] };
        }
        return { name: raw, tier: null };
      }

      // 搜索：中文名与内码都能命中。**只过滤列表，不加载资源** ——
      // 以前每敲一个字都会重新拉图集和骨骼，纯属浪费。
      function applyFilter() {
        var keyword = $("assetSearchBox").value.trim().toLowerCase();
        app.cursor = -1;
        app.listLimit = 20;
        $("assetList").scrollTop = 0;
        app.shown = !keyword ? app.all.slice() : app.all.filter(function (name) {
          return name.toLowerCase().indexOf(keyword) >= 0
            || displayName(name).toLowerCase().indexOf(keyword) >= 0;
        });
        renderAssetList();
      }

      // ---------------------------------------------------------------------
      // 与 gtatlas 联动：列表行显示缩略图
      //
      // gtatlas 的精灵图是 TexturePacker 格式（frames + meta.image），帧名就是内码，
      // 所以换算很简单：illust 去掉 illust_ 前缀去 portraits 表里查，character 原样查 characters 表。
      // 两个项目在同一仓库、同一站点根下，用相对路径 ../gtatlas/ 即可。
      // ---------------------------------------------------------------------
      var GTATLAS_ASSETS = "../gtatlas/assets/";
      var THUMB_SHEET = { illust: "portraits", character: "characters" };
      var THUMB_BOX = 30;

      function ensureThumbSheet(sheet) {
        var entry = app.sheets[sheet];
        if (entry) return entry;
        entry = { name: sheet, frames: null, img: null, w: 0, h: 0, failed: false };
        app.sheets[sheet] = entry;
        fetch(GTATLAS_ASSETS + sheet + ".json")
          .then(function (res) {
            if (!res.ok) throw new Error(res.status);
            return res.json();
          })
          .then(function (data) {
            entry.frames = (data && data.frames) || {};
            var img = new Image();
            img.onload = function () {
              entry.img = img;
              entry.w = img.naturalWidth;
              entry.h = img.naturalHeight;
              renderAssetList();        // 图到位后重画一次，缩略图就显出来了
            };
            img.onerror = function () { entry.failed = true; };
            img.src = GTATLAS_ASSETS + sheet + ".png";
          })
          .catch(function (err) {
            entry.failed = true;
            if (window.console && console.debug) {
              console.debug("[gtasset] 缩略图不可用（" + sheet + "）:", err && err.message ? err.message : err);
            }
          });
        return entry;
      }

      // 两边帧名体系不完全一致，按可信度依次试：
      //   精确        —— 多数命中
      //   星阶分档    —— gtasset 存基名（captain_rabbit），gtatlas 只存 captain_rabbit_3/4/5
      //   去/加 _b    —— 一边有 _b 变体、另一边没有
      // 只认「数字结尾」和「_b」这两种受控后缀，绝不做任意前缀匹配，免得张冠李戴。
      var TIER_RE = /_\d{1,2}$/;

      function buildFrameIndex(entry) {
        if (entry.index) return entry.index;
        var index = { tier: {}, stripB: {} };
        for (var key in entry.frames) {
          if (!Object.prototype.hasOwnProperty.call(entry.frames, key)) continue;
          var m = TIER_RE.exec(key);
          if (m) {
            var base = key.slice(0, -m[0].length);
            var digit = parseInt(m[0].slice(1), 10);
            // 同一基名有多个分档时取最小的，结果稳定可预期
            if (index.tier[base] === undefined || digit < index.tier[base]) index.tier[base] = digit;
          }
          if (key.slice(-2) === "_b") {
            var bare = key.slice(0, -2);
            if (index.stripB[bare] === undefined) index.stripB[bare] = key;
          }
        }
        entry.index = index;
        return index;
      }

      function findFrame(entry, name) {
        if (!entry || !entry.frames) return null;
        var index = buildFrameIndex(entry);
        var keys = [name];
        if (TIER_RE.test(name)) keys.push(name.replace(TIER_RE, ""));
        if (index.tier[name] !== undefined) keys.push(name + "_" + index.tier[name]);
        if (name.slice(-2) === "_b") keys.push(name.slice(0, -2));
        keys.push(name + "_b");
        for (var i = 0; i < keys.length; i++) {
          if (entry.frames[keys[i]]) return entry.frames[keys[i]];
        }
        return null;
      }

      // 把精灵图里某一帧按 contain 摆进 box×box 的方框（居中）
      function makeThumb(entry, frame) {
        var thumb = document.createElement("canvas");
        thumb.className = "thumb";
        thumb.width = thumb.height = THUMB_BOX;
        if (!entry || !entry.img || !frame || !frame.frame) return thumb;
        var rect = frame.frame;
        var w = frame.rotated ? rect.h : rect.w, h = frame.rotated ? rect.w : rect.h;
        if (!w || !h) return thumb;
        var scale = Math.min(THUMB_BOX / w, THUMB_BOX / h);
        var context = thumb.getContext("2d");
        context.imageSmoothingEnabled = false;
        context.translate(THUMB_BOX / 2, THUMB_BOX / 2);
        if (frame.rotated) context.rotate(-Math.PI / 2);
        // The source rectangle is always the packed frame, never a square
        // expanded into neighboring sprites. Contain padding is transparent.
        context.drawImage(entry.img, rect.x, rect.y, rect.w, rect.h,
          -rect.w * scale / 2, -rect.h * scale / 2, rect.w * scale, rect.h * scale);
        return thumb;
      }

      function thumbFor(entry, name) {
        if (!entry || !entry.frames || !entry.img) return makeThumb(null, null);
        var key = app.folder === "illust" ? String(name).replace(/^illust_/, "") : name;
        var frame = findFrame(entry, key);
        return makeThumb(entry, frame);
      }

      // =====================================================================
      // Character equipment (one shared item atlas, independent character state)
      // =====================================================================
      function equipmentReady() {
        return app.folder === "character" && app.model && app.model.folder === "character"
          && app.model.name === app.current && app.equipment;
      }

      function equipmentState() {
        var name = app.model.name;
        return app.equipmentByCharacter[name]
          || (app.equipmentByCharacter[name] = Object.create(null));
      }

      function ensureItems() {
        if (app.itemSheet && !app.itemSheet.failed) return;
        var entry = app.itemSheet = { name: "items", frames: null, zh: {}, img: null };
        $("equipmentStatus").textContent = "正在加载物品图集……";
        Promise.all([
          fetch(GTATLAS_ASSETS + "items.json" + QUERY).then(function (res) {
            return checkResponse(res, "items.json").json();
          }),
          fetch(GTATLAS_ASSETS + "items.zh.json" + QUERY).then(function (res) {
            return res.ok ? res.json() : {};
          }).catch(function () { return {}; })
        ]).then(function (pair) {
          entry.frames = pair[0].frames || {};
          entry.zh = pair[1];
          return loadImage(GTATLAS_ASSETS + (pair[0].meta.image || "items.png") + QUERY);
        }).then(function (img) {
          entry.img = img;
          entry.w = img.naturalWidth;
          entry.h = img.naturalHeight;
          // items.png is straight alpha; the character renderer uses premultiplied alpha.
          var previous = gl.getParameter(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL);
          gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
          try { entry.texture = makeTexture(img); }
          finally { gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, previous); }
          entry.attachments = Object.create(null);
          restoreEquipment();
        }).catch(function (err) {
          entry.failed = true;
          $("equipmentStatus").textContent = "物品加载失败：" + err.message + "（切回 character 可重试）";
          refreshEquipmentPanel();
        });
      }

      function itemAttachment(name) {
        var sheet = app.itemSheet;
        if (!sheet || !sheet.texture || !sheet.frames[name]) return null;
        return sheet.attachments[name] || (sheet.attachments[name] = GTEquipment.createAttachment(
          spine, name, sheet.frames[name], sheet.texture, sheet.w, sheet.h));
      }

      function restoreEquipment() {
        if (!app.model || app.model.folder !== "character") {
          app.equipment = null;
          refreshEquipmentPanel();
          return;
        }
        if (app.equipment && app.equipment.skeleton === app.skeleton) app.equipment.clear();
        else app.equipment = new GTEquipment.Equipment(app.skeleton);
        var state = equipmentState();
        app.skeleton.slots.forEach(function (slot) {
          var item = state[GTEquipment.slotKey(slot.data.name)];
          var attachment = item && itemAttachment(item);
          if (attachment) app.equipment.equip(slot, attachment);
        });
        app.animState.apply(app.skeleton);
        populateEquipmentSlots();
        renderItemList();
      }

      function populateEquipmentSlots() {
        var select = $("equipmentSlot");
        var wanted = select.value;
        select.innerHTML = "";
        if (!equipmentReady()) return;
        var slots = app.skeleton.slots.filter(function (slot) {
          // A clipping slot must retain its clipping attachment.
          return !app.skeleton.data.skins.some(function (skin) {
            return skin.getAttachments().some(function (entry) {
              return entry.slotIndex === slot.data.index && entry.attachment instanceof spine.ClippingAttachment;
            });
          });
        });
        slots.sort(function (a, b) {
          function rank(slot) { return /weapon1/i.test(slot.data.name) ? 0 : /weapon|item/i.test(slot.data.name) ? 1 : 2; }
          return rank(a) - rank(b) || a.data.index - b.data.index;
        });
        slots.forEach(function (slot) {
          var option = document.createElement("option");
          option.value = GTEquipment.slotKey(slot.data.name);
          option.textContent = slot.bone.data.name + " · " + slot.data.name;
          select.appendChild(option);
        });
        if (Array.prototype.some.call(select.options, function (o) { return o.value === wanted; })) select.value = wanted;
        refreshEquipmentPanel();
      }

        });
        names.sort(function (a, b) {

          text.appendChild(code);

        }

      function renderEquippedList() {
        var list = $("equippedList");

          text.className = "asset-text";

          code.textContent = item;

      function removeEquipment(key) {

      $("itemSearch").addEventListener("input", function () { app.itemLimit = 20; renderItemList(); });
      $("itemList").addEventListener("scroll", function () {

        if (this.scrollTop + this.clientHeight < this.scrollHeight - 10) return;

      });
      $("equipmentSlot").addEventListener("change", refreshEquipmentPanel);
      function equipSelectedItem() {

        if (!key) return;

        if (!attachment) return;

          if (GTEquipment.slotKey(slot.data.name) === key) app.equipment.equip(slot, attachment);
        });

      }
      $("equipBtn").addEventListener("click", equipSelectedItem);
      $("unequipAllBtn").addEventListener("click", function () {
        if (!equipmentReady()) return;
        app.equipment.clear();
        app.equipmentByCharacter[app.model.name] = Object.create(null);
        app.animState.apply(app.skeleton);
        refreshEquipmentPanel();
      });

      function renderAssetList() {
        var list = $("assetList");
        list.innerHTML = "";
        var total = app.shown.length;
        var shown = Math.min(total, app.listLimit);
        var sheet = THUMB_SHEET[app.folder];
        var entry = sheet ? ensureThumbSheet(sheet) : null;
        var frag = document.createDocumentFragment();
        for (var i = 0; i < shown; i++) {
          var name = app.shown[i];
          var item = document.createElement("button");
          item.type = "button";
          item.className = "asset-item" + (name === app.current ? " on" : "");
          item.dataset.name = name;

          if (entry) {
            var thumb = thumbFor(entry, name);
            item.appendChild(thumb);
          }

          var text = document.createElement("span");
          text.className = "asset-text";

          var zh = document.createElement("span");
          zh.className = "zh";
          zh.textContent = displayName(name);
          text.appendChild(zh);

            code.textContent = name;

          : total + " / " + app.all.length;
