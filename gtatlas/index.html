<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>坎公图集解析器</title>
    <style>
        :root {
            --bg: #f4f5f7;
            --panel: #ffffff;
            --border: #e5e7eb;
            --border-strong: #d6dae1;
            --text: #1f2430;
            --muted: #6b7280;
            --faint: #9aa1ad;
            --accent: #4a628f;
            --accent-hover: #3c5179;
            --accent-soft: #eef1f7;
            --radius: 12px;
            --shadow-sm: 0 1px 2px rgba(16, 24, 40, .05);
            --shadow-md: 0 4px 16px rgba(16, 24, 40, .07);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC',
                         'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 28px 20px 56px;
            font-size: 14px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1240px;
            margin: 0 auto;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        /* ---------- header ---------- */
        .header {
            padding: 26px 32px 22px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(180deg, #fcfcfd 0%, var(--panel) 100%);
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: .01em;
        }

        .header p {
            margin-top: 5px;
            color: var(--muted);
            font-size: 13px;
        }

        /* ---------- toolbar ---------- */
        .upload-section {
            padding: 16px 32px;
            background: #fafbfc;
            border-bottom: 1px solid var(--border);
        }

        .upload-area {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .file-input { display: none; }

        button {
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            border-radius: 8px;
            transition: background-color .15s, border-color .15s, color .15s;
        }

        .upload-btn {
            padding: 8px 15px;
            border: 1px solid var(--border-strong);
            background: var(--panel);
            color: var(--text);
        }

        .upload-btn:hover { background: #f2f4f7; border-color: var(--faint); }

        #uploadStatus { color: var(--muted); font-size: 13px; }

        /* ---------- search ---------- */
        .search-section {
            padding: 16px 32px;
            border-bottom: 1px solid var(--border);
        }

        .search-container {
            display: flex;
            gap: 10px;
            max-width: 720px;
            margin: 0 auto;
        }

        .search-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            color: var(--text);
            background: var(--panel);
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }

        .search-input::placeholder { color: var(--faint); }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .advanced-search {
            padding: 10px 16px;
            border: 1px solid var(--border-strong);
            background: var(--panel);
            color: var(--muted);
            white-space: nowrap;
        }

        .advanced-search:hover { background: #f2f4f7; color: var(--text); }

        /* ---------- content ---------- */
        .content-section { padding: 24px 32px 32px; }

        .spritesheet-select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            color: var(--text);
            background: var(--panel);
            outline: none;
            cursor: pointer;
            transition: border-color .15s, box-shadow .15s;
        }

        .spritesheet-select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .region-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }

        .region-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            transition: border-color .15s, box-shadow .15s;
        }

        .region-item:hover {
            border-color: var(--border-strong);
            box-shadow: var(--shadow-sm);
        }

        /* checkerboard so transparent sprite edges are visible */
        .region-image {
            flex: none;
            width: 56px;
            height: 56px;
            object-fit: contain;
            /* these are pixel-art sprites: nearest-neighbour, never interpolated,
               so a small icon blown up to the box stays crisp instead of blurry */
            image-rendering: pixelated;
            border: 1px solid var(--border);
            border-radius: 8px;
            background-color: #fff;
            background-image:
                linear-gradient(45deg, #eef0f3 25%, transparent 25%, transparent 75%, #eef0f3 75%),
                linear-gradient(45deg, #eef0f3 25%, transparent 25%, transparent 75%, #eef0f3 75%);
            background-size: 12px 12px;
            background-position: 0 0, 6px 6px;
        }

        .region-info { flex: 1; min-width: 0; }

        .region-name {
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .region-meta {
            margin-top: 3px;
            font-size: 12px;
            color: var(--faint);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .download-btn {
            flex: none;
            padding: 6px 13px;
            border: 1px solid var(--border-strong);
            background: var(--panel);
            color: var(--accent);
            font-size: 12px;
        }

        .download-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        /* jump links reuse the download button look; they are <a>, so reset the
           inline defaults */
        a.download-btn {
            display: inline-block;
            text-decoration: none;
            white-space: nowrap;
        }

        /* ---------- pagination ---------- */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-top: 26px;
            flex-wrap: wrap;
        }

        .page-btn {
            min-width: 34px;
            padding: 7px 10px;
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }

        .page-btn:hover:not(:disabled) {
            border-color: var(--accent);
            color: var(--accent);
        }

        .page-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .page-btn:disabled { opacity: .45; cursor: not-allowed; }

        .page-gap { padding: 7px 4px; color: var(--faint); }

        /* ---------- states ---------- */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding: 56px 20px;
            color: var(--muted);
        }

        .spinner {
            width: 26px;
            height: 26px;
            border: 2px solid var(--border-strong);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state { padding: 64px 20px; text-align: center; color: var(--faint); }
        .empty-state svg { color: var(--border-strong); }
        .empty-state p { margin-top: 12px; font-size: 14px; }

        /* ---------- modal ---------- */
        .advanced-search-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            align-items: center;
            justify-content: center;
            background: rgba(24, 28, 36, .38);
            padding: 20px;
        }

        .advanced-search-content {
            width: 100%;
            max-width: 400px;
            padding: 24px;
            background: var(--panel);
            border-radius: 14px;
            box-shadow: 0 16px 48px rgba(16, 24, 40, .18);
        }

        .modal-title { font-size: 16px; font-weight: 600; margin-bottom: 18px; }

        .search-options { display: flex; flex-direction: column; gap: 4px; }

        .search-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 10px;
            border-radius: 8px;
            cursor: pointer;
        }

        .search-option:hover { background: #f6f7f9; }
        .search-option label { flex: 1; color: #414855; cursor: pointer; font-size: 13px; }

        .search-option input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }

        .modal-btn { padding: 9px 20px; border: 1px solid transparent; }

        .apply-btn { background: var(--accent); color: #fff; }
        .apply-btn:hover { background: var(--accent-hover); }

        .cancel-btn { background: var(--panel); border-color: var(--border-strong); color: var(--muted); }
        .cancel-btn:hover { background: #f2f4f7; color: var(--text); }

        @media (max-width: 700px) {
            body { padding: 16px 12px 40px; }
            .header, .upload-section, .search-section { padding-left: 18px; padding-right: 18px; }
            .content-section { padding: 18px; }
            .region-list { grid-template-columns: 1fr; }
            .search-container { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>坎公图集解析器</h1>
            <p>选择图集后可按名称筛选、预览并下载单个切片</p>
        </div>

        <div class="upload-section">
            <div class="upload-area">
                <input type="file" id="imageInput" class="file-input" accept=".png">
                <input type="file" id="jsonInput" class="file-input" accept=".json">
                <button class="upload-btn" onclick="document.getElementById('imageInput').click()">上传 PNG 图集</button>
                <button class="upload-btn" onclick="document.getElementById('jsonInput').click()">上传 JSON 配置</button>
                <span id="uploadStatus"></span>
            </div>
        </div>

        <div class="search-section">
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="输入内码或中文名进行筛选…" oninput="filterRegions()">
                <button class="advanced-search" onclick="showAdvancedSearch()">高级查找</button>
            </div>
        </div>

        <div class="content-section">
            <select class="spritesheet-select" id="spritesheetSelect" onchange="loadSpritesheet()">
                <option value="">— 请选择图集 —</option>
            </select>

            <div id="loadingIndicator" class="loading" style="display: none;">
                <div class="spinner"></div>
                <span>正在加载图集资源…</span>
            </div>

            <div id="regionList" class="region-list"></div>

            <div id="emptyState" class="empty-state" style="display: none;">
                <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="11" cy="11" r="7"></circle>
                    <path d="M20 20l-3.5-3.5"></path>
                </svg>
                <p>暂无匹配的资源</p>
            </div>

            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <div class="advanced-search-modal" id="advancedSearchModal">
        <div class="advanced-search-content">
            <h3 class="modal-title">高级查找选项</h3>
            <div class="search-options">
                <div class="search-option">
                    <input type="checkbox" id="caseSensitive" checked>
                    <label for="caseSensitive">区分大小写</label>
                </div>
                <div class="search-option">
                    <input type="checkbox" id="exactMatch">
                    <label for="exactMatch">精确匹配</label>
                </div>
                <div class="search-option">
                    <input type="checkbox" id="regexMatch">
                    <label for="regexMatch">正则表达式</label>
                </div>
            </div>
            <div class="modal-buttons">
                <button class="modal-btn cancel-btn" onclick="closeAdvancedSearch()">取消</button>
                <button class="modal-btn apply-btn" onclick="applyAdvancedSearch()">应用</button>
            </div>
        </div>
    </div>

    <script>
        let currentSpritesheet = null;
        let allRegions = [];
        let filteredRegions = [];
        let currentPage = 1;
        let zhNames = {};
        const itemsPerPage = 12;
        let searchOptions = {
            caseSensitive: true,
            exactMatch: false,
            regexMatch: false
        };

        // `zh` is an optional sidecar of {internalCode: 中文名}; when present the
        // Chinese name is shown first and is searchable alongside the internal code
        let spritesheets = [
            { name: '物品', png: './assets/items.png', json: './assets/items.json', zh: './assets/items.zh.json' },
            { name: '角色', png: './assets/characters.png', json: './assets/characters.json', zh: './assets/characters.zh.json' },
            { name: '头像', png: './assets/portraits.png', json: './assets/portraits.json', zh: './assets/portraits.zh.json' },
            { name: '头像框', png: './assets/PortraitFrame.png', json: './assets/PortraitFrame.json', zh: './assets/PortraitFrame.zh.json' },
            { name: '徽章', png: './assets/Badge.png', json: './assets/Badge.json', zh: './assets/Badge.zh.json' },
            { name: 'Boss', png: './assets/bosses.png', json: './assets/bosses.json', zh: './assets/bosses.zh.json' },
            { name: '战斗UI', png: './assets/battle.png', json: './assets/battle.json' },
            { name: '贴纸', png: './assets/ProfilecardStickers.png', json: './assets/ProfilecardStickers.json', zh: './assets/ProfilecardStickers.zh.json' },
            { name: '任务物品', png: './assets/questItems.png', json: './assets/questItems.json' },
            { name: '农场物品', png: './assets/farmItems.png', json: './assets/farmItems.json', zh: './assets/farmItems.zh.json' },
            { name: '贴纸2', png: './assets/ProfilecardStickers2.png', json: './assets/ProfilecardStickers2.json', zh: './assets/ProfilecardStickers2.zh.json' },
            { name: '贴纸包', png: './assets/StickerPack.png', json: './assets/StickerPack.json', zh: './assets/StickerPack.zh.json' },
            { name: '公会徽章', png: './assets/emblems.png', json: './assets/emblems.json' },
            { name: '主界面UI', png: './assets/main_ui.png', json: './assets/main_ui.json' },
            { name: '主界面UI S3', png: './assets/MainUiS3.png', json: './assets/MainUiS3.json' },
            { name: '卡马逊', png: './assets/Kamazon.png', json: './assets/Kamazon.json', zh: './assets/Kamazon.zh.json' },
            { name: '天空城建造', png: './assets/construction_hh.png', json: './assets/construction_hh.json' },
            { name: '裂隙', png: './assets/rift.png', json: './assets/rift.json' },
            { name: '本地化文字', png: './assets/localization.png', json: './assets/localization.json' },
            { name: '本地化文字 补充', png: './assets/LocalizationSub.png', json: './assets/LocalizationSub.json' },
        ];

        document.addEventListener('DOMContentLoaded', function() {
            populateSpritesheetSelector();
            document.getElementById('imageInput').addEventListener('change', handleFileUpload);
            document.getElementById('jsonInput').addEventListener('change', handleFileUpload);
            document.getElementById('advancedSearchModal').addEventListener('click', function(e) {
                if (e.target === this) closeAdvancedSearch();
            });
        });

        function populateSpritesheetSelector() {
            const select = document.getElementById('spritesheetSelect');
            select.innerHTML = '';
            const placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.textContent = '— 请选择图集 —';
            select.appendChild(placeholder);

            spritesheets.forEach((sheet, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = sheet.name;
                select.appendChild(option);
            });
        }

        async function loadSpritesheet() {
            const index = document.getElementById('spritesheetSelect').value;
            if (index === '') {
                currentSpritesheet = null;
                allRegions = filteredRegions = [];
                zhNames = {};
                renderRegionList();
                renderPagination();
                return;
            }

            showLoading(true);
            try {
                const sheet = spritesheets[index];

                const response = await fetch(sheet.json);
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const jsonData = await response.json();

                // a missing sidecar just means this atlas shows internal codes only
                zhNames = {};
                if (sheet.zh) {
                    try {
                        const zhResponse = await fetch(sheet.zh);
                        if (zhResponse.ok) zhNames = await zhResponse.json();
                    } catch (e) {
                        console.warn('未找到中文名映射:', sheet.zh);
                    }
                }

                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = function() {
                    currentSpritesheet = { ...sheet, img: img };
                    allRegions = filterBlankRegions(parseSpritesheetData(jsonData, img), img);
                    for (const region of allRegions) region.zh = zhNames[region.name] || '';
                    filteredRegions = [...allRegions];
                    currentPage = 1;
                    renderRegionList();
                    renderPagination();
                    showLoading(false);
                };
                img.onerror = function() {
                    alert('加载图片失败，请检查路径是否正确');
                    showLoading(false);
                };
                img.src = sheet.png;
            } catch (error) {
                console.error('加载图集失败:', error);
                alert('加载图集失败: ' + error.message);
                showLoading(false);
            }
        }

        function parseSpritesheetData(data, img) {
            const regions = [];
            const push = (name, frame, rotated) => {
                regions.push({
                    name: name,
                    x: frame.x || 0,
                    y: frame.y || 0,
                    w: frame.w || frame.width || 0,
                    h: frame.h || frame.height || 0,
                    rotated: !!rotated,
                    zh: '',
                    img: img
                });
            };

            const frames = data.frames;

            if (Array.isArray(frames)) {
                frames.forEach((frame, index) => {
                    push(frame.name || `region_${index}`, frame.frame || frame, frame.rotated);
                });
            } else if (frames && typeof frames === 'object') {
                for (const regionName in frames) {
                    const frameData = frames[regionName];
                    push(regionName, frameData.frame || frameData, frameData.rotated);
                }
            }

            return regions;
        }

        // Drop fully transparent frames on load - that covers both spare padding and
        // the game's deliberate 1x1 "no sprite" placeholders (items/empty,
        // characters/big_boss, portraits/bounty_hunter).
        // One full-image read plus an alpha prefix sum answers "is this rect empty?"
        // in O(1) per frame, so even the 2858-frame items atlas is a single pass.
        function filterBlankRegions(regions, img) {
            if (!regions.length) return regions;

            const width = img.naturalWidth || img.width;
            const height = img.naturalHeight || img.height;
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            ctx.drawImage(img, 0, 0);

            let pixels;
            try {
                pixels = ctx.getImageData(0, 0, width, height).data;
            } catch (e) {
                // tainted canvas: show everything rather than nothing
                return regions;
            }

            const stride = width + 1;
            const sums = new Uint32Array(stride * (height + 1));
            for (let y = 0; y < height; y++) {
                let rowHits = 0;
                const rowStart = y * stride;
                const nextStart = rowStart + stride;
                for (let x = 0; x < width; x++) {
                    if (pixels[(y * width + x) * 4 + 3] !== 0) rowHits++;
                    sums[nextStart + x + 1] = sums[rowStart + x + 1] + rowHits;
                }
            }

            const visible = [];
            for (const region of regions) {
                // a rotated frame is stored turned 90 degrees, so its packed
                // footprint is the transpose of its display size
                const packedW = region.rotated ? region.h : region.w;
                const packedH = region.rotated ? region.w : region.h;
                const x0 = Math.max(0, region.x);
                const y0 = Math.max(0, region.y);
                const x1 = Math.min(width, region.x + packedW);
                const y1 = Math.min(height, region.y + packedH);

                let hits = 0;
                if (x1 > x0 && y1 > y0) {
                    hits = sums[y1 * stride + x1] - sums[y0 * stride + x1]
                         - sums[y1 * stride + x0] + sums[y0 * stride + x0];
                }

                if (hits > 0) visible.push(region);
            }

            return visible;
        }

        // Draw one sprite into a canvas sized to its display (un-rotated) size.
        // `rotated` means the atlas holds it turned 90 degrees clockwise inside an
        // (h x w) rect, so it is drawn back through a 90 degree counter-clockwise turn.
        // Smoothing is always off: the art is pixel art, so any resampling would
        // blur it. The CSS side matches with `image-rendering: pixelated`.
        function drawRegion(ctx, img, region, targetW, targetH) {
            ctx.imageSmoothingEnabled = false;
            if (region.rotated) {
                ctx.save();
                ctx.translate(0, targetH);
                ctx.rotate(-Math.PI / 2);
                ctx.drawImage(img, region.x, region.y, region.h, region.w, 0, 0, targetH, targetW);
                ctx.restore();
            } else {
                ctx.drawImage(img, region.x, region.y, region.w, region.h, 0, 0, targetW, targetH);
            }
        }

        function makeThumbnail(region) {
            // cap the preview so a 1000px-wide frame does not allocate a full-size
            // canvas and a multi-megabyte data URL just for a 56px box
            const scale = Math.min(1, 128 / Math.max(region.w, region.h, 1));
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(region.w * scale));
            canvas.height = Math.max(1, Math.round(region.h * scale));
            drawRegion(canvas.getContext('2d'), region.img, region, canvas.width, canvas.height);
            return canvas.toDataURL();
        }

        function renderRegionList() {
            const regionList = document.getElementById('regionList');
            const emptyState = document.getElementById('emptyState');

            if (!currentSpritesheet) {
                regionList.innerHTML = '';
                regionList.style.display = 'none';
                emptyState.style.display = 'none';
                return;
            }

            if (filteredRegions.length === 0) {
                regionList.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }

            regionList.style.display = 'grid';
            emptyState.style.display = 'none';

            const startIndex = (currentPage - 1) * itemsPerPage;
            const pageRegions = filteredRegions.slice(startIndex, startIndex + itemsPerPage);

            regionList.innerHTML = '';
            pageRegions.forEach(region => {
                const item = document.createElement('div');
                item.className = 'region-item';

                const thumb = document.createElement('img');
                thumb.className = 'region-image';
                thumb.src = makeThumbnail(region);
                thumb.alt = region.zh || region.name;
                thumb.loading = 'lazy';

                const info = document.createElement('div');
                info.className = 'region-info';

                // the Chinese name wins; the internal code stays underneath as the
                // thing you would actually reference or search for
                const nameEl = document.createElement('div');
                nameEl.className = 'region-name';
                nameEl.textContent = region.zh || region.name;
                nameEl.title = region.zh ? `${region.zh}  ·  ${region.name}` : region.name;

                const subParts = [];
                if (region.zh) subParts.push(region.name);
                if (region.rotated) subParts.push('已旋转');

                info.appendChild(nameEl);
                if (subParts.length) {
                    const metaEl = document.createElement('div');
                    metaEl.className = 'region-meta';
                    metaEl.textContent = subParts.join(' · ');
                    info.appendChild(metaEl);
                }

                const btn = document.createElement('button');
                btn.className = 'download-btn';
                btn.textContent = '下载';
                // downloaded files keep the internal code, which stays unique
                btn.addEventListener('click', () => downloadRegion(region));

                item.appendChild(thumb);
                item.appendChild(info);
                item.appendChild(btn);

                // 与 gtasset 联动：头像表跳立绘、角色表跳角色
                const target = gtassetTargetFor(region);
                if (target) {
                    const jump = document.createElement('a');
                    jump.className = 'download-btn';
                    jump.textContent = target.label;
                    jump.title = '在 gtasset 中打开：' + target.name;
                    jump.href = target.href;
                    jump.target = '_blank';
                    jump.rel = 'noopener';
                    item.appendChild(jump);
                }

                regionList.appendChild(item);
            });
        }

        function renderPagination() {
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';

            const totalPages = Math.ceil(filteredRegions.length / itemsPerPage);
            if (!currentSpritesheet || totalPages <= 1) {
                pagination.style.display = 'none';
                return;
            }

            pagination.style.display = 'flex';

            const addBtn = (label, page, opts = {}) => {
                const btn = document.createElement('button');
                btn.className = 'page-btn' + (opts.active ? ' active' : '');
                btn.textContent = label;
                btn.disabled = !!opts.disabled;
                if (!opts.disabled && !opts.active) btn.onclick = () => changePage(page);
                pagination.appendChild(btn);
            };

            addBtn('‹', currentPage - 1, { disabled: currentPage === 1 });

            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || Math.abs(i - currentPage) <= 2) {
                    addBtn(String(i), i, { active: i === currentPage });
                } else if (Math.abs(i - currentPage) === 3) {
                    const gap = document.createElement('span');
                    gap.className = 'page-gap';
                    gap.textContent = '…';
                    pagination.appendChild(gap);
                }
            }

            addBtn('›', currentPage + 1, { disabled: currentPage === totalPages });
        }

        function changePage(page) {
            const totalPages = Math.ceil(filteredRegions.length / itemsPerPage);
            if (page >= 1 && page <= totalPages) {
                currentPage = page;
                renderRegionList();
                renderPagination();
                document.getElementById('regionList').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        // 与 gtasset 的联动目标。
        // 换算很简单：立绘在 gtasset 里就是本表帧名加个 illust_ 前缀，角色名两边完全一致。
        //   portraits.png  帧 adela_noble  ->  ../gtasset/index.html?folder=illust&name=illust_adela_noble
        //   characters.png 帧 adela_noble_3 ->  ../gtasset/index.html?folder=character&name=adela_noble_3
        // 两个项目在同一仓库、同一站点根下，所以用相对路径 ../gtasset/。
        function gtassetTargetFor(region) {
            if (!currentSpritesheet || !region || !region.name) return null;
            const src = String(currentSpritesheet.json || '');
            if (src.indexOf('portraits') >= 0) {
                const name = 'illust_' + region.name;
                return {
                    name: name,
                    label: '看立绘',
                    href: '../gtasset/index.html?folder=illust&name=' + encodeURIComponent(name)
                };
            }
            if (src.indexOf('characters') >= 0) {
                return {
                    name: region.name,
                    label: '看角色',
                    href: '../gtasset/index.html?folder=character&name=' + encodeURIComponent(region.name)
                };
            }
            return null;
        }

        function downloadRegion(region) {
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, region.w);
            canvas.height = Math.max(1, region.h);
            drawRegion(canvas.getContext('2d'), region.img, region, canvas.width, canvas.height);

            const link = document.createElement('a');
            link.download = region.name + '.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function showLoading(show) {
            document.getElementById('loadingIndicator').style.display = show ? 'flex' : 'none';
        }

        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const uploadStatus = document.getElementById('uploadStatus');
            uploadStatus.textContent = `已选择: ${file.name}`;

            if (file.name.toLowerCase().endsWith('.png')) {
                window.uploadedImage = URL.createObjectURL(file);
                checkAndLoadUploadedFiles();
            } else if (file.name.toLowerCase().endsWith('.json')) {
                try {
                    window.uploadedJson = JSON.parse(await file.text());
                    checkAndLoadUploadedFiles();
                } catch (error) {
                    alert('JSON文件格式错误: ' + error.message);
                }
            }
            event.target.value = '';
        }

        function checkAndLoadUploadedFiles() {
            if (!window.uploadedImage || !window.uploadedJson) return;

            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = function() {
                currentSpritesheet = { img: img, name: '上传的图集' };
                allRegions = filterBlankRegions(parseSpritesheetData(window.uploadedJson, img), img);
                filteredRegions = [...allRegions];
                currentPage = 1;
                document.getElementById('spritesheetSelect').value = '';
                renderRegionList();
                renderPagination();

                document.getElementById('uploadStatus').textContent = '';
                window.uploadedImage = null;
                window.uploadedJson = null;
            };
            img.onerror = function() {
                alert('加载上传的图片失败');
            };
            img.src = window.uploadedImage;
        }

        function filterRegions() {
            const searchTerm = document.getElementById('searchInput').value;

            if (!searchTerm.trim()) {
                filteredRegions = [...allRegions];
            } else {
                // a region matches on its internal code OR its Chinese name, so both
                // "admiral" and "海军" find the same portrait
                const test = (text) => {
                    if (!text) return false;
                    if (searchOptions.regexMatch) {
                        try {
                            return new RegExp(searchTerm, searchOptions.caseSensitive ? '' : 'i').test(text);
                        } catch (e) {
                            return false;
                        }
                    }
                    if (searchOptions.exactMatch) {
                        return searchOptions.caseSensitive
                            ? text === searchTerm
                            : text.toLowerCase() === searchTerm.toLowerCase();
                    }
                    return searchOptions.caseSensitive
                        ? text.includes(searchTerm)
                        : text.toLowerCase().includes(searchTerm.toLowerCase());
                };

                filteredRegions = allRegions.filter(region => test(region.name) || test(region.zh));
            }

            currentPage = 1;
            renderRegionList();
            renderPagination();
        }

        function showAdvancedSearch() {
            document.getElementById('advancedSearchModal').style.display = 'flex';
        }

        function closeAdvancedSearch() {
            document.getElementById('advancedSearchModal').style.display = 'none';
        }

        function applyAdvancedSearch() {
            searchOptions.caseSensitive = document.getElementById('caseSensitive').checked;
            searchOptions.exactMatch = document.getElementById('exactMatch').checked;
            searchOptions.regexMatch = document.getElementById('regexMatch').checked;
            closeAdvancedSearch();
            filterRegions();
        }
    </script>
</body>
</html>
