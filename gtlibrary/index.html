<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>坎公资源库</title><link rel="icon" href="../favicon.ico"><link rel="stylesheet" href="library.css"></head>
<body>
<header class="library-header"><a class="brand" href="#view=atlas"><span class="brand-mark"><img src="../favicon.ico" alt="" width="32" height="32"></span><span>坎公资源库<small>GUARDIAN TALES · RESOURCE LIBRARY</small></span></a><nav aria-label="资源功能"><button data-view="atlas">图集</button><button data-view="spine">像素动画</button><button data-view="fx">特效</button><button data-view="map">地图</button></nav><button id="help" aria-label="使用说明">?</button></header>
<section class="context-bar"><form id="search-form" role="search"><label class="sr-only" for="library-search">查找角色或资源</label><input id="library-search" type="search" placeholder="查找角色或资源 · 中文名 / 内部编号" autocomplete="off"><button type="submit">查找</button></form><div class="current-context"><span id="context">浏览全部资源</span><span id="related" aria-label="关联资源"></span></div></section>
<section id="results" aria-label="搜索结果" hidden></section>
<main id="workspace" aria-label="资源工作区"><p id="status" role="status">正在打开资源库…</p></main>
<dialog id="help-dialog"><h2>坎公资源库</h2><p>选择功能，再选择资源，调整预览。地图可按编号筛选并查看图层、环境和图块信息。顶部搜索可同时找到图集、像素动画、特效中的全部可选资源及全部地图。</p><p>选择一个角色后，顶部会显示其关联资源。图集卡片也可以直接打开像素动画、立绘或特效。浏览器的前进、后退和地址链接均可使用。</p><p>切换功能会释放当前预览。返回时保留资源选择；本地上传和未完成的导出请在当前功能中完成。并非每个角色都有全部三类资源。</p><button id="close-help">知道了</button></dialog>

</body></html>
