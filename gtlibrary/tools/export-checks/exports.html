<!doctype html><meta charset="utf-8"><title>GTLibrary 导出验证</title><style>body{font:14px system-ui;background:#171c24;color:#ddd}button,select{padding:8px;margin:8px}#host{width:850px;height:480px}pre{white-space:pre-wrap}</style><h1>静态导出验证</h1><button id="video">验证视频与透明序列</button><button id="map">加载合作远征局部</button><button id="afterworld">加载完整冥界地图</button><button id="glb">导出 GLB</button><button id="obj">导出 OBJ</button><button id="blender">导出 Blender</button><button id="cancel">验证取消</button><p id="status">就绪</p><div id="host"></div><pre id="report"></pre><div id="downloads"></div><script type="module">
import {MapRuntime,decodeMap,assetsForMap} from '../../gtmap/core.js';
import * as THREE from '../../vendor/three.module.js';
import {GLTFLoader} from './GLTFLoader.js';
import {exportAnimation} from '../../core/animation-export.js';
const $=id=>document.getElementById(id),root=new URL('../../gtmap/assets/',location.href),json=async p=>{const r=await fetch(new URL(p,root));if(!r.ok)throw Error(p+' '+r.status);return p.endsWith('.gz')?new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).json():r.json();};
let importedRenderer;
async function importPreview(bytes){const loaded=await new GLTFLoader().parseAsync(bytes,'');loaded.scene.traverse(o=>{if(o.userData.gtRenderOrder)o.renderOrder=o.userData.gtRenderOrder;if(o.isMesh)o.renderOrder=o.material.userData.gtRenderOrder||0;});const camera=loaded.cameras[0];loaded.scene.updateMatrixWorld(true);importedRenderer?.dispose();importedRenderer?.domElement.remove();importedRenderer=new THREE.WebGLRenderer({antialias:true});importedRenderer.setSize(850,480);importedRenderer.setClearColor(0x0f1116);document.querySelector('#host').after(importedRenderer.domElement);importedRenderer.render(loaded.scene,camera);results.reimport={meshes:loaded.scene.children.length,failedPrograms:importedRenderer.info.programs.filter(p=>p.diagnostics?.runnable===false).length};}
let runtime;const results={};const link=(blob,name)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.textContent=name;$('downloads').append(a,document.createElement('br'));};
function report(){ $('report').textContent=JSON.stringify(results,null,2); }
async function load(full=false){$('status').textContent='加载地图';const [catalog,manifest,formats,sorting]=await Promise.all([json('catalog.json'),json('native-effects.json'),json('vertex-formats.json'),json('sorting-layers.json')]);const id=full?'afterworld_1_1':'coop_exp_s2_battle_1_hard',item=catalog.maps.find(m=>m.id===id),doc=await decodeMap(await fetch(new URL(item.file,root)).then(r=>r.arrayBuffer()),id),focus=doc.layers.flatMap(l=>l.tiles||[]).find(t=>t.name==='[GIMMICK]new_portal_enter');
const subset=full?doc:{...doc,layers:doc.layers.filter(l=>l.type===0).map(l=>({...l,tiles:l.tiles.filter(t=>Math.abs(t.x-focus.x)<4&&Math.abs(t.z-focus.z)<4)}))};subset.tileCount=subset.layers.reduce((n,l)=>n+l.tiles.length,0);const pack=await json(item.pack),effects={};await Promise.all(subset.tilesets.map(async s=>{if(manifest.sets[s.name])effects[s.name]=await json(manifest.sets[s.name]);}));runtime?.dispose();runtime=new MapRuntime($('host'));await runtime.loadAssets(assetsForMap({...pack,vertexFormats:formats,sortingLayers:sorting.layers,environment:{effects}},subset),p=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(Error(p));im.src=new URL(p,root);}));const built=await runtime.build(subset);runtime.render(3);results.map={id,...built};$('status').textContent='地图就绪';report();}
$('map').onclick=()=>load().catch(e=>{$('status').textContent=e.stack;});$('afterworld').onclick=()=>load(true).catch(e=>{$('status').textContent=e.stack;});
for(const format of ['glb','obj','blender'])$(format).onclick=async()=>{try{$('status').textContent='导出 '+format;const result=await runtime.export({format,time:3,quality:32,effects:true,onProgress:(p,t)=>$('status').textContent=t+' '+Math.round(p*100)+'%'});link(result.blob,result.name);results[format]={bytes:result.blob.size,...result.metadata};if(format==='glb'){const bytes=await result.blob.arrayBuffer(),dv=new DataView(bytes);await importPreview(bytes);results.glb.headerValid=dv.getUint32(0,true)===0x46546c67&&dv.getUint32(8,true)===bytes.byteLength;const j=JSON.parse(new TextDecoder().decode(new Uint8Array(bytes,20,dv.getUint32(12,true))));results.glb.embeddedImages=j.images.length;results.glb.nodes=j.nodes.length;results.glb.meshes=j.meshes.length;results.glb.alphaMaterials=j.materials.filter(m=>m.alphaMode==='BLEND').length;results.glb.cameraCount=j.cameras.length;results.glb.allUnlit=j.materials.every(m=>m.extensions.KHR_materials_unlit);const mat=runtime.getTileRecords().find(t=>t.partCount&&t.name.includes('floor'));runtime.selectTiles([mat.id]);runtime.editSelection({move:[2,0,0],scale:[2,1,1]});const edited=await runtime.export({selectionOnly:true,effects:false,time:3});results.selectionExport={...edited.metadata};runtime.resetEdits(true);runtime.clearSelection();}report();$('status').textContent='导出成功';}catch(e){results[format]={error:e.stack};report();$('status').textContent=e.message;}};
$('cancel').onclick=async()=>{const controller=new AbortController();controller.abort();try{await runtime.export({signal:controller.signal});results.cancel=false;}catch(e){results.cancel=e.name==='AbortError';}results.previewAfterCancel=runtime.getDiagnostics();report();};
$('video').onclick=async()=>{try{for(const format of ['mp4','mov','png']){const result=await exportAnimation({format,width:257,height:129,frames:12,fps:12,duration:1,transparent:true,background:'#003344',getFrame:i=>{const a=new Uint8Array(257*129*4);for(let y=20;y<100;y++)for(let x=20+i*8;x<80+i*8;x++){const k=(y*257+x)*4;a.set([255,60,30,128],k);}return a;},onProgress:p=>$('status').textContent=format+' '+Math.round(p*100)+'%'});link(result.blob,'test.'+result.extension);results[format]={bytes:result.blob.size,width:result.width,height:result.height,frames:result.frames,duration:result.duration};}const c=new AbortController();try{await exportAnimation({format:'mp4',width:64,height:64,frames:120,fps:30,duration:4,signal:c.signal,getFrame:i=>{if(i===2)c.abort();return new Uint8Array(64*64*4);}});results.videoCancel=false;}catch(e){results.videoCancel=e.name==='AbortError';}report();$('status').textContent='视频完成';}catch(e){results.videoError=e.stack;report();$('status').textContent=e.message;}};
</script>
