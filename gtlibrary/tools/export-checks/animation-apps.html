<!doctype html><meta charset="utf-8"><title>动画应用导出验证</title><style>body{background:#171c24;color:white;font:14px system-ui}iframe{width:100%;height:calc(100vh - 90px);border:0}button,a{margin:12px;padding:8px}</style><button id="spine">Spine</button><button id="fx">特效</button><button id="mirror">提取应用下载链接</button><div id="downloads"></div><iframe id="app" src="../../apps/spine/index.html?folder=character&name=akayuki_2"></iframe><script>
const frame=document.getElementById('app');document.getElementById('spine').onclick=()=>frame.src='../../apps/spine/index.html?folder=character&name=akayuki_2';document.getElementById('fx').onclick=()=>frame.src='../../apps/fx/index.html?character=hana';document.getElementById('mirror').onclick=()=>{const d=frame.contentDocument,source=d.querySelector('#mediaDownload:not([hidden]),#download-gif:not([hidden])');if(!source)throw Error('请先导出');const link=document.createElement('a');link.href=source.href;link.download=source.download;link.textContent=source.download;document.getElementById('downloads').append(link);};
</script>
