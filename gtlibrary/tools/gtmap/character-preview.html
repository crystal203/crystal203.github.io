<!doctype html>
<meta charset="utf-8"><title>地图人物动画接入验证</title>
<style>body{margin:0;background:#17212c;color:#eef;font:16px system-ui}header{padding:12px}label{margin-right:20px}select,button{font:inherit}#stage{height:65vh}pre{white-space:pre-wrap;font:13px monospace;padding:12px}</style>
<header>Spine → Three.js 最小合成验证（未接入地图主界面） <label>方向<select id="direction"><option>front</option><option>back</option><option>side</option></select></label><label>动作<select id="action"><option>idle</option><option>walk</option><option>run</option></select></label><button id="pause">暂停</button></header>
<div id="stage"></div><pre id="report">加载…</pre>
<script src="../../core/delivery-config.js"></script><script src="../../core/delivery.js"></script><script src="../../core/resources.js"></script><script src="../../gtasset/core.js"></script><script src="../../vendor/spine-webgl.js"></script>
<script type="module">
import * as THREE from '../../vendor/three.module.js';
import {decodeMap} from '../../gtmap/decoder.js';
const report=document.querySelector('#report'),host=document.querySelector('#stage'),renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0x17212c);host.append(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-5,5,3,-3,.1,100);camera.position.set(0,10,10);camera.lookAt(0,0,0);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(14,8),new THREE.MeshBasicMaterial({color:0xa3b983}));floor.rotation.x=-Math.PI/2;scene.add(floor);
// An opaque test wall proves these animated triangles participate in scene depth.
const wall=new THREE.Mesh(new THREE.BoxGeometry(.6,1,1.5),new THREE.MeshBasicMaterial({color:0x9d6b51}));wall.position.set(.4,.5,1);scene.add(wall);
const sourceNames=['desert_slave_2','desertelf_prison_officer','aw_hana_kid'],models=[],resources=new Map(),maps=[];
const blendFactors={0:THREE.ZeroFactor,1:THREE.OneFactor,768:THREE.SrcColorFactor,769:THREE.OneMinusSrcColorFactor,770:THREE.SrcAlphaFactor,771:THREE.OneMinusSrcAlphaFactor,772:THREE.DstAlphaFactor,773:THREE.OneMinusDstAlphaFactor,774:THREE.DstColorFactor,775:THREE.OneMinusDstColorFactor};
const skeletonRenderer=new spine.webgl.SkeletonRenderer(null,true);let paused=false,last=0,frame=0,loadGeneration=0;
const vertexShader=`attribute vec4 light; attribute vec4 dark; varying vec2 vUv; varying vec4 vLight; varying vec4 vDark; void main(){vUv=uv;vLight=light;vDark=dark;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`;
const fragmentShader=`uniform sampler2D image; varying vec2 vUv; varying vec4 vLight; varying vec4 vDark; void main(){vec4 c=texture2D(image,vUv);float a=c.a*vLight.a;if(a<.01)discard;gl_FragColor=vec4(((c.a-1.)*vDark.a+1.-c.rgb)*vDark.rgb+c.rgb*vLight.rgb,a);}`;
function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h);camera.left=-5;camera.right=5;camera.top=5*h/w;camera.bottom=-5*h/w;camera.updateProjectionMatrix();}resize();addEventListener('resize',resize);
async function data(name,variant){
 const key=name+':'+variant;if(resources.has(key))return resources.get(key);
 const pending=(async()=>{const prefix='../../resources/spine/character/',atlasText=await GTResources.fetch(prefix+name+'.atlas').then(r=>{if(!r.ok)throw Error(name+' atlas '+r.status);return r.text();});
 const [bytes,images]=await Promise.all([GTResources.fetch(prefix+name+'_'+variant+'.bytes').then(r=>{if(!r.ok)throw Error(name+' skeleton '+r.status);return r.arrayBuffer();}),Promise.all(GTSpineCore.pages(atlasText).map(p=>GTResources.image(prefix+p)))]);
 return GTSpineCore.parse({spine,atlasText,bytes,images,createTexture:image=>{const proxy=new spine.FakeTexture(image),texture=new THREE.Texture(image);texture.flipY=false;texture.magFilter=texture.minFilter=THREE.NearestFilter;texture.generateMipmaps=false;texture.needsUpdate=true;proxy.three=texture;proxy.dispose=()=>texture.dispose();return proxy;}});})();resources.set(key,pending);return pending;
}
function setAction(model){const names=model.skeleton.data.animations.map(a=>a.name),variant=document.querySelector('#direction').value,wanted=document.querySelector('#action').value;
 model.state.clearTracks();model.skeleton.setToSetupPose();model.action=names.find(n=>n===wanted+'_'+variant)||names.find(n=>n===wanted)||names.find(n=>n==='idle_'+variant)||names.find(n=>n==='idle')||names.find(n=>!n.startsWith('['));
 if(model.action)model.state.setAnimation(0,model.action,true);for(const [i,prefix] of [[1,'[emo]idle'],[2,'[sub]idle']]){const n=names.find(n=>n===prefix+'_'+variant)||names.find(n=>n===prefix);if(n)model.state.setAnimation(i,n,true);}
}
function disposeModel(model){scene.remove(model.group);for(const m of model.meshes){m.geometry.dispose();m.material.dispose();}}
async function load(){const token=++loadGeneration;try{const direction=document.querySelector('#direction').value,decoded=await Promise.all(sourceNames.map(n=>data(n,direction)));if(token!==loadGeneration)return;models.splice(0).forEach(disposeModel);
 decoded.forEach((d,i)=>{const skeleton=GTSpineCore.createInstance(spine,d.data),skin=d.data.skins.find(s=>s.name===sourceNames[i])||d.data.skins.at(-1);if(skin)skeleton.setSkinByName(skin.name);const group=new THREE.Group();group.position.set((i-1)*3,0,0);group.quaternion.copy(camera.quaternion);group.scale.setScalar(.04);scene.add(group);const model={name:sourceNames[i],skeleton,state:new spine.AnimationState(new spine.AnimationStateData(d.data)),group,meshes:[]};setAction(model);models.push(model);});last=0;showReport();}catch(e){report.textContent=e.stack;}}
function draw(model){let cursor=0,blend=[770,771];skeletonRenderer.draw({setBlendMode:(src,dst)=>{blend=[src,dst];},draw:(texture,vertices,indices)=>{
 const count=vertices.length/12;let mesh=model.meshes[cursor];if(!mesh){const geometry=new THREE.BufferGeometry(),material=new THREE.ShaderMaterial({vertexShader,fragmentShader,uniforms:{image:{value:texture.three}},transparent:true,depthWrite:false,depthTest:true,side:THREE.DoubleSide,toneMapped:false});mesh=new THREE.Mesh(geometry,material);mesh.frustumCulled=false;model.group.add(mesh);model.meshes.push(mesh);}
 mesh.visible=true;mesh.renderOrder=cursor;mesh.material.uniforms.image.value=texture.three;mesh.material.blending=THREE.CustomBlending;mesh.material.blendSrc=blendFactors[blend[0]];mesh.material.blendDst=blendFactors[blend[1]];
 const p=new Float32Array(count*3),uv=new Float32Array(count*2),light=new Float32Array(count*4),dark=new Float32Array(count*4);
 for(let v=0;v<count;v++){const o=v*12;p.set([vertices[o],vertices[o+1],0],v*3);uv.set(vertices.subarray(o+6,o+8),v*2);light.set(vertices.subarray(o+2,o+6),v*4);dark.set(vertices.subarray(o+8,o+12),v*4);}
 if(mesh.geometry.getAttribute('position')?.count!==count||mesh.geometry.index?.count!==indices.length){mesh.geometry.dispose();mesh.geometry=new THREE.BufferGeometry();for(const [key,values,size] of [['position',p,3],['uv',uv,2],['light',light,4],['dark',dark,4]])mesh.geometry.setAttribute(key,new THREE.BufferAttribute(values,size));mesh.geometry.setIndex(Array.from(indices));}else{for(const [key,values] of [['position',p],['uv',uv],['light',light],['dark',dark]]){const attr=mesh.geometry.getAttribute(key);attr.array.set(values);attr.needsUpdate=true;}mesh.geometry.index.array.set(indices);mesh.geometry.index.needsUpdate=true;}cursor++;
 }},model.skeleton);for(let i=cursor;i<model.meshes.length;i++)model.meshes[i].visible=false;}
function showReport(){report.textContent=JSON.stringify({scope:'开发验证：同一 Three.js 场景内实时骨骼三角形、透明混合、深度遮挡；地面与墙为验证模型',frame,models:models.map(m=>({name:m.name,skin:m.skeleton.skin?.name,animation:m.action,clips:m.skeleton.data.animations.length,draws:m.meshes.filter(x=>x.visible).length,bones:m.skeleton.bones.length})),maps,failedPrograms:renderer.info.programs.filter(p=>p.diagnostics?.runnable===false).length},null,2);}
renderer.setAnimationLoop(t=>{const dt=last?Math.min(.05,(t-last)/1000):0;last=t;for(const m of models){if(!paused){m.state.update(dt);m.state.apply(m.skeleton);m.skeleton.updateWorldTransform();}draw(m);}renderer.render(scene,camera);if(++frame%120===0)showReport();});
document.querySelector('#direction').onchange=load;document.querySelector('#action').onchange=()=>{models.forEach(setAction);showReport();};document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'播放':'暂停';showReport();};
// Read current deployed files; v10 IDs are inspected only as an opaque payload
// prefix. This does not pretend to decode v10's remaining unknown fields.
for(const name of ['desert_1_1','afterworld_1_1']){try{const bytes=await fetch('../../gtmap/assets/maps/'+name+'.bytes').then(r=>r.arrayBuffer()),doc=await decodeMap(bytes,name),rows=[];for(const layer of doc.layers)for(const event of layer.events)for(const p of event.properties||[]){if(p.component!=='Tilemaps.CharacterPlaceholder')continue;let id=p.value.characterId;if(!id){const b=p.value.raw;let n=0,i=4;for(let shift=0;shift<35;shift+=7){const v=b[i++];n+=(v&127)*2**shift;if(!(v&128))break;}if(i+n>b.length)throw Error('人物 ID 头部截断');id=new TextDecoder('utf8',{fatal:true}).decode(b.subarray(i,i+n));}rows.push({id,version:p.value.version,position:event.position});}maps.push({name,total:rows.length,placed:rows.filter(r=>r.position[0]!==999&&r.position[2]!==999).length,versions:[...new Set(rows.map(r=>r.version))],sample:rows.filter(r=>r.position[0]!==999&&r.position[2]!==999).slice(0,2)});}catch(e){maps.push({name,error:e.message});}}
await load();
addEventListener('pagehide',()=>{renderer.setAnimationLoop(null);models.forEach(disposeModel);resources.forEach(p=>p.then(d=>d.dispose()));floor.geometry.dispose();floor.material.dispose();wall.geometry.dispose();wall.material.dispose();renderer.dispose();},{once:true});
</script>
