<!doctype html><meta charset="utf-8"><title>Native shader validation</title><style>body{background:#0f1116;color:#fff;font:14px system-ui}#host{width:800px;height:500px}</style><h1>原生材质 GPU 验证</h1><p id="status">验证中</p><ul id="results"></ul><div id="host"></div><script type="module">
import {MapRuntime} from '../../../gtmap/core.js';
const status=document.querySelector('#status'),out=document.querySelector('#results');let runtime;
try{const raw=await new Response((await fetch('./shaders.json.gz')).body.pipeThrough(new DecompressionStream('gzip'))).json();const pack={...raw,setOrder:['fixture'],templates:{}};let i=0;const names=[];for(const t of Object.values(raw.templates)){const name='shader_'+i++;pack.templates['1:'+name]={...t,name};names.push(name);}runtime=new MapRuntime(document.querySelector('#host'));await runtime.loadAssets(pack,url=>new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=new URL('../../../gtmap/assets/'+url,location.href);}));for(const name of names){const doc={tilesets:[{name:'fixture'}],layers:[{type:0,name:'sample',tiles:[{ts:1,name,x:0,y:0,z:0,rotation:0}]}],tileCount:1};await runtime.build(doc);runtime.render();const d=runtime.getDiagnostics();if(d.failedPrograms||!d.drawCalls)throw new Error(name+' '+JSON.stringify(d));const li=document.createElement('li');li.textContent='PASS '+pack.materials[pack.templates['1:'+name].parts[0].materials[0]]?.nativeShader.name;out.append(li);await new Promise(r=>requestAnimationFrame(r));}status.textContent='PASS '+names.length+' native shaders';document.body.dataset.result='pass';runtime.dispose();}catch(e){status.textContent=e.stack;document.body.dataset.result='fail';}
</script>
