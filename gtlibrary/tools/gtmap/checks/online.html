<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>GTOnline native integration checks</title><link rel="stylesheet" href="../../../gtmap/dialogue.css"><style>body{margin:0;background:#14251c;color:#ddd;font:14px system-ui}header{height:42px;display:flex;gap:16px;align-items:center;padding:0 14px}button{padding:6px 14px}#stage{position:absolute;inset:42px 0 0}#result{position:absolute;top:54px;left:12px;z-index:8;background:#14251ce8;padding:12px;max-width:60%;white-space:pre-wrap;pointer-events:none;font-size:12px}</style><header><button id="courtyard" disabled>查看旅馆视野</button><button id="run">运行原生资源回归</button><span>1-1 · alt_forest_1_1_2_2</span></header><div id="stage"></div><output id="result">等待运行</output><script src="../../../core/cache-version.js"></script><script src="../../../core/delivery-config.js"></script><script src="../../../core/delivery.js"></script><script src="../../../core/resources.js"></script><script src="../../../core/map-catalog.js"></script><script type="module">
import {loadMapRuntime} from '../../../gtmap/load-map.js';import {OnlineGame} from '../../../gtonline/game.js';import {fresh} from '../../../gtonline/progress.js';
const host=document.getElementById('stage'),out=document.getElementById('result'),button=document.getElementById('run');let runtime,game;
document.getElementById('courtyard').onclick=()=>{game.pause();game.runtime.events.finish();game.currentScene=null;game.backgroundScene=false;game.mode='play';game.state.position=stageData.spawn.slice();runtime.setWorldPosition(game.player,game.state.position);runtime.setActorState(game.player,{direction:'front',animation:'idle'});game.focus();game.pause();out.hidden=true;};let stageData;
const assert=(ok,text)=>{if(!ok)throw Error(text);out.textContent+='\nPASS '+text;},frame=()=>new Promise(r=>requestAnimationFrame(r));
button.onclick=async()=>{button.disabled=true;try{out.textContent='Loading native resources…';const stage=await GTResources.fetch(new URL('../../../gtonline/assets/stage-1-1.json',import.meta.url)).then(r=>r.json());stageData=stage;runtime?.dispose();({runtime}=await loadMapRuntime(host,stage.map));const saved=fresh(stage);saved.flags=['opening'];game=new OnlineGame(runtime,stage,{saved,storage:null});await game.start();runtime.frameListeners.delete(game.frame);out.textContent='Native renderer ready';
await game.scene('opening');const player=runtime.events,wake=stage.scenes.opening.commands.find(c=>c.op==='pose'&&c.target==='leader'&&c.animation==='idle'&&c.at>0).at;player.playing=false;for(let t=0;t<wake;t+=.1){player.seek(t);if(game.player.character.settings.animation!=='prostrate')throw Error('rider stood at '+t);}assert(game.player.character.action==='prostrate_side','骑士拖行直到苏醒始终使用 prostrate_side');player.seek(player.duration);await game.endScene();
for(const dir of ['front','back','left','right']){await runtime.setActorState(game.player,{direction:dir});game.direction=dir;game.clock+=1;game.attack();await frame();assert(/^attack_(front|back|side)$/.test(game.player.character.action),'攻击真实动画 '+dir+' → '+game.player.character.action);}
game.state.position=[.5,0,-8.8];runtime.setWorldPosition(game.player,game.state.position);await game.scene('section_2');assert(game.mode==='play','追逐不锁定玩家操作');const before=game.state.position[2];game.keys.add('s');game.lastTime=0;game.tick(.1);game.keys.clear();assert(game.state.position[2]<before,'追逐时仍能移动');game.clock+=1;game.attack();assert(game.attackUntil>game.clock,'追逐时仍能攻击');player.seek(player.duration);await game.endScene();assert(!game.groups.has('first'),'门外播放事件后保持门开启');const p=game.collision.move(game.state.position,0,-3.4);assert(p[2]<-11,'可穿过第一道门走入战斗房间');game.state.position=p;runtime.setWorldPosition(game.player,p);game.tick(0);for(let i=0;i<120&&game.groups.get('first')!=='active';i++)await frame();assert(game.groups.get('first')==='active'&&game.inFirstArena(),'完全进入房间后启动战斗');assert(game.objects.filter(o=>o.handle.startsWith('first_goblin_gate')).every(o=>o.record.visible),'战斗门视觉和碰撞同步');
assert(!game.collision.canStand(4.6,3,0)&&game.collision.canStand(5.8,3,0),'树桩原生碰撞对齐整数中心');const stairs=game.collision.move([3.5,0,10],0,3);assert(stairs[1]===1&&Math.abs(stairs[2]-13)<.01,'原生楼梯自动上台');assert(game.collision.drop([-3,1,12.3],0,-1)!==null,'指定低台边缘允许跳下');assert(game.collision.drop([.5,1,13.7],0,1)===null,'围栏边缘禁止跳下');
game.focus();game.mode='play';runtime.frameListeners.add(game.frame);out.textContent+='\nALL PASS';document.body.dataset.result='pass';document.getElementById('courtyard').disabled=false;}catch(e){out.textContent+='\nFAIL '+e.stack;document.body.dataset.result='fail';}finally{button.disabled=false;}};
</script></html>
