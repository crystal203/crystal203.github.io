<!doctype html><meta charset="utf-8"><title>共享特效核心回归检查</title><style>body{background:#151922;color:#ddd;font:14px system-ui}canvas{width:800px;height:450px}</style><p id="status">检查中</p><pre id="report"></pre><canvas></canvas><script type="module">
import {FxRuntime} from '../../../gtfx/core.js';
const base=new URL('../../../gtfx/assets/',location.href),index=await fetch(new URL('characters/adelanoble.json',base)).then(r=>r.json()),runtime=new FxRuntime(document.querySelector('canvas'));const results=[],missing=[];try{runtime.grid.visible=false;runtime.setBackground('transparent');for(const effect of index.effects){try{await runtime.load(index,p=>new URL(p,new URL('characters/adelanoble.json',base)),{effect});}catch(e){if(e instanceof Event){missing.push({id:effect.id,reason:'Original texture request failed'});continue;}throw e;}runtime.build(effect);runtime.fitView();let pixels=0;for(const time of [.05,Math.max(.1,effect.duration*.25),Math.max(.2,effect.duration*.6)]){runtime.sample(time);const gl=runtime.renderer.getContext(),data=new Uint8Array(gl.drawingBufferWidth*gl.drawingBufferHeight*4);gl.readPixels(0,0,gl.drawingBufferWidth,gl.drawingBufferHeight,gl.RGBA,gl.UNSIGNED_BYTE,data);let visible=0;for(let i=3;i<data.length;i+=4)if(data[i]>5)visible++;pixels=Math.max(pixels,visible);}if(runtime.renderer.info.programs.some(p=>p.diagnostics?.runnable===false))throw Error('Shader '+effect.id);results.push({id:effect.id,pixels});}if(results.length+missing.length!==46||results.length<10||results.filter(r=>r.pixels>100).length<10)throw Error('Empty effects');document.body.dataset.result='pass';document.querySelector('#status').textContent='通过 · '+results.length+' 个具备源贴图的角色特效、'+results.length*3+' 次 GPU 采样；'+missing.length+' 个旧目录样本缺少贴图';}catch(e){document.body.dataset.result='fail';document.querySelector('#status').textContent=e.stack||e.message||String(e);}document.querySelector('#report').textContent=JSON.stringify({missing,count:results.length,visible:results.filter(r=>r.pixels>100).length,results},null,2);runtime.dispose();
</script>
