<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>GTMap 390px 响应式验证</title><style>body{margin:0;background:#171a22;color:#fff;font:13px system-ui}iframe{width:390px;height:844px;border:0;display:block}p{margin:12px}</style><iframe id="mobile-frame" title="390 × 844 资源库" src="../../../index.html#view=map&amp;map=coop_exp_s1_boss"></iframe><p>390 × 844 CSS 像素：验证分类菜单、选图、预览以及横向溢出。</p><p id="status">检查中</p><ol id="results"></ol><script type="module">
const frame=document.querySelector('#mobile-frame'),out=document.querySelector('#results'),status=document.querySelector('#status'),tick=()=>new Promise(r=>requestAnimationFrame(r));function check(name,value){const li=document.createElement('li');li.textContent=(value?'PASS · ':'FAIL · ')+name;out.append(li);if(!value)throw Error(name);}async function wait(fn){const start=performance.now();while(!fn()){if(performance.now()-start>60000)throw Error('timeout');await tick();}}
try{await wait(()=>frame.contentDocument?.querySelector('iframe')?.contentDocument?.querySelector('#stage')?.dataset.ready==='true');const top=frame.contentDocument,d=top.querySelector('iframe').contentDocument,$=id=>d.getElementById(id);check('390px 页面没有横向溢出',top.documentElement.scrollWidth===390&&d.documentElement.scrollWidth===390);check('默认显示分类',$('category').value==='categories');$('menu').click();check('地图菜单展开',d.body.classList.contains('menu-open'));$('category').value='coopexp_s1';$('category').dispatchEvent(new Event('change'));check('窄屏多级目录',$('category-title').textContent.includes('赛季1'));$('maps').querySelector('[data-map="coop_exp_s1_boss_hard"]').click();await wait(()=>$('stage').dataset.ready==='true');check('选图后菜单关闭并完成预览',!d.body.classList.contains('menu-open')&&$('stage').dataset.map==='coop_exp_s1_boss_hard');check('父页同步地图及目录路由',frame.contentWindow.location.hash.includes('category=coopexp_s1')&&frame.contentWindow.location.hash.includes('map=coop_exp_s1_boss_hard'));check('选图后没有横向溢出',top.documentElement.scrollWidth===390&&d.documentElement.scrollWidth===390);status.textContent='全部通过';document.body.dataset.result='pass';}catch(e){status.textContent=e.stack;document.body.dataset.result='fail';}
</script></html>
