<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Timeline editor regression checks</title><link rel="stylesheet" href="../../../shared/theme.css"><link rel="stylesheet" href="../../../apps/map/style.css"><style>body{padding:20px}#results{white-space:pre-wrap}</style>
<h1>Timeline editor regression checks</h1><pre id="results">Running…</pre><details id="scene-panel" open style="height:350px;max-height:350px"><summary>Timeline</summary><div class="scene-body"><div id="timeline-editor-view"><div id="timeline-editor"></div></div></div></details>
<script type="module">
import {TimelineEditor} from '../../../apps/map/timeline-editor.js';
const output=document.getElementById('results'),log=[];const assert=(v,message)=>{if(!v)throw Error(message);log.push('PASS '+message);};
try{
 const errors=[],runtime={events:{resolve:()=>({position:{x:100,y:0,z:0},tile:{name:'Actor'}})}};
 const editor=new TimelineEditor(document.getElementById('timeline-editor'),{runtime,onChange(){},onSeek(){},onError:e=>errors.push(e)});
 editor.set({version:1,duration:20,commands:[{op:'dialogue',at:2,duration:3,text:'original'}],trigger:{kind:'near',target:'actor'}});
 assert(!editor.plan.trigger,'legacy trigger is ignored');
 const before=JSON.stringify(editor.plan);try{editor.set({version:1,commands:{}});}catch{}
 assert(JSON.stringify(editor.plan)===before,'invalid JSON structure preserves current timeline');
 editor.selected=0;editor.render();let field=editor.inspector.querySelector('[data-field=at]');field.value='-1';field.onchange();
 assert(editor.plan.commands[0].at===2&&errors.length===1,'negative time cannot be committed');
 field=editor.inspector.querySelector('[data-field=at]');field.value='4';field.onchange();
 assert(editor.plan.commands[0].at===4&&editor.plan.duration===20,'valid edit preserves explicit total duration');
 assert(editor.past.length===1,'one property edit creates one undo step');editor.undo();assert(editor.plan.commands[0].at===2,'undo restores property');editor.undo(true);assert(editor.plan.commands[0].at===4,'redo restores edit');
 editor.selected=0;editor.duplicate();assert(editor.plan.commands[1].at===7,'duplicate appends after original clip');editor.remove();assert(editor.plan.commands.length===1,'delete removes selected clip');editor.undo();assert(editor.plan.commands.length===2,'delete can be undone');
 const route={op:'move',target:'actor',at:0,from:[10,0,0],points:[[2,0,0],[4,0,0]],relative:true,speed:2};assert(editor.span(route)===2,'relative route points share one stable origin');
 editor.selected=0;editor.render();const clip=editor.sheet.querySelector('[data-index="0"]'),snapshot=JSON.stringify(editor.plan);clip.setPointerCapture=()=>{};
 editor.drag({button:0,preventDefault(){},stopPropagation(){},clientX:100,pointerId:1,target:clip},0,clip);clip.onpointermove({clientX:150});clip.onpointercancel();
 assert(JSON.stringify(editor.plan)===snapshot&&clip.onpointermove===null,'cancelled drag restores plan and releases handlers');
 editor.set({version:1,commands:[{op:'pose',target:'actor',at:0,animation:'idle'},{op:'pose',target:'actor',at:0,expression:'smile'}]});assert(editor.tracks().length===2,'animation and expression use separate tracks');
 editor.set({version:1,duration:3600,commands:Array.from({length:30},(_,i)=>({op:'pose',target:'actor'+i,at:i*80,duration:20,animation:'idle'}))});
 const view=editor.viewport,rect=view.getBoundingClientRect(),dock=document.getElementById('scene-panel').getBoundingClientRect();
 assert(view.scrollWidth>view.clientWidth*10&&view.scrollHeight>view.clientHeight,'long scene uses both scroll directions');
 assert(rect.bottom<=dock.bottom&&rect.right<=dock.right&&view.clientHeight>50,'track viewport and scrollbars remain inside the dock');
 view.scrollLeft=10000;view.scrollTop=500;
 assert(view.scrollLeft>0&&view.scrollTop>0&&view.getBoundingClientRect().right===rect.right,'horizontal scrolling cannot move the vertical scrollbar offscreen');
 output.textContent=log.join('\n')+'\nALL PASSED';
}catch(e){output.textContent=log.join('\n')+'\nFAIL '+e.stack;}
</script></html>
