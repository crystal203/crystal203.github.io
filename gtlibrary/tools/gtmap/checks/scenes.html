<!doctype html><meta charset="utf-8"><title>GTMap 原始效果实景对照</title><style>body{background:#13171e;color:#ddd;font:14px system-ui;margin:16px}h1{font-size:19px}button{background:#222b38;border:1px solid #456;color:#eee;border-radius:6px;padding:8px;margin:4px}#host{width:min(1100px,95vw);height:650px}#report{white-space:pre-wrap}#status{min-height:20px}</style><h1>GTMap 原始效果实景对照</h1><p>使用源地图及源贴图，展示选定效果周围的局部区域。中键平移、滚轮缩放。</p><nav id="cases"></nav><p id="status">加载中</p><div id="host"></div><pre id="report"></pre><script type="module">
import {MapRuntime,decodeMap,assetsForMap} from '../../../gtmap/core.js';
const root=new URL('../../../gtmap/assets/',location.href),json=async p=>{const r=await fetch(new URL(p,root));if(!r.ok)throw Error('HTTP '+p);return p.endsWith('.gz')?new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).json():r.json();};
const host=document.querySelector('#host'),status=document.querySelector('#status'),runtime=new MapRuntime(host),images=new Map(),packs=new Map(),extras={};const image=p=>{if(!images.has(p))images.set(p,new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=new URL(p,root);}));return images.get(p);};
const catalog=await json('catalog.json'),manifest=await json('native-effects.json'),vertexFormats=await json('vertex-formats.json'),sortingLayers=(await json('sorting-layers.json')).layers;
const cases=[['合作远征：红色伤害地砖','coop_exp_s2_battle_1_hard','[gimmick]dot_tile_3x3',10],['合作远征：传送门','coop_exp_s2_battle_1_hard','[GIMMICK]new_portal_enter',9],['冥界：环境云雾','afterworld_1_1','FX_cloud_1',15],['雪山：薄雾','newnew_snowmountain_1_2','[fx]snow_fog',14],['雪山：篝火','snowmountain_1_3','[gimmick]campfire',8],['战场：浓烟','civilwar_5','fx_fire_smoke_slow_shear',12],['妖精世界：落叶','pixyworld_2','FX_pw_leaf_loop',10]];
let serial=0;async function show([label,id,tileName,radius]){const token=++serial;status.textContent='加载 '+id+'…';try{const map=catalog.maps.find(m=>m.id===id),doc=await decodeMap(await fetch(new URL(map.file,root)).then(r=>r.arrayBuffer()),id),focus=doc.layers.flatMap(l=>l.tiles||[]).find(t=>t.name===tileName);if(!focus)throw Error('源地图没有 '+tileName);if(!packs.has(map.pack))packs.set(map.pack,await json(map.pack));const effects={};await Promise.all(doc.tilesets.map(async set=>{if(!manifest.sets[set.name])return;if(!extras[set.name])extras[set.name]=await json(manifest.sets[set.name]);effects[set.name]=extras[set.name];}));if(token!==serial)return;
const subset={...doc,layers:doc.layers.filter(l=>l.type===0).map(l=>({...l,tiles:l.tiles.filter(t=>Math.abs(t.x-focus.x)<=radius&&Math.abs(t.z-focus.z)<=radius)}))};subset.tileCount=subset.layers.reduce((n,l)=>n+l.tiles.length,0);await runtime.loadAssets(assetsForMap({...packs.get(map.pack),vertexFormats,sortingLayers,environment:{effects}},subset),image);const built=await runtime.build(subset);runtime.setView('oblique');runtime.fit();runtime.render(3);const diagnostics=runtime.getDiagnostics();if(diagnostics.failedPrograms)throw Error('Shader 失败');status.textContent=label+' · '+id+' · '+tileName;document.querySelector('#report').textContent=JSON.stringify({id,focus:[focus.x,focus.y,focus.z],...built,diagnostics},null,2);host.dataset.result='pass';host.dataset.map=id;}catch(e){status.textContent=e.stack;host.dataset.result='fail';}}
for(const c of cases){const b=document.createElement('button');b.textContent=c[0];b.onclick=()=>show(c);document.querySelector('#cases').append(b);}await show(cases[0]);
</script>
