<!doctype html><meta charset="utf-8"><title>GTMap 目录与滚动验证</title><style>body{background:#0f1116;color:#eee;font:13px system-ui;padding:20px}iframe{width:1000px;height:460px;border:1px solid #444}.fail{color:#f88}</style><h1>目录与滚动验证</h1><p id="status">检查中</p><ol id="results"></ol><iframe id="app" src="../../../apps/map/index.html?map=afterworld_1_1"></iframe><script type="module">
const iframe=document.querySelector('#app'),results=document.querySelector('#results'),status=document.querySelector('#status'),tick=()=>new Promise(r=>requestAnimationFrame(r));
function check(name,value){const li=document.createElement('li');li.textContent=(value?'PASS · ':'FAIL · ')+name;li.className=value?'pass':'fail';results.append(li);if(!value)throw Error(name);}
async function wait(fn){const start=performance.now();while(!fn()){if(performance.now()-start>90000)throw Error('UI timeout');await tick();}}
try{await wait(()=>iframe.contentDocument?.querySelector('#stage')?.dataset.ready==='true');const d=iframe.contentDocument,$=id=>d.getElementById(id),cat=$('category'),maps=$('maps');const choose=value=>{cat.value=value;cat.dispatchEvent(new Event('change',{bubbles:true}));};const scroll=async n=>{maps.scrollTop=n;await tick();await tick();return maps.scrollTop;};const back=async()=>{$('back-category').click();await tick();await tick();};
check('默认分类浏览，世界01到22先于外传',cat.value==='categories'&&[...maps.querySelectorAll('[data-category]')].slice(0,22).every((b,i)=>b.dataset.category==='world_'+String(i+1).padStart(2,'0')));
const rootPosition=await scroll(750);choose('world_10');await tick();await back();check('返回根目录恢复原滚动位置',cat.value==='categories'&&maps.scrollTop===rootPosition&&rootPosition>0);
choose('dungeons');await tick();const dungeonPosition=await scroll(300);maps.querySelector('[data-category="elementaltower"]').click();await tick();maps.querySelector('[data-category="elementaltower_fire"]').click();await tick();check('属性塔多级目录正确',cat.value==='elementaltower_fire'&&$('category-title').textContent.includes('火属性'));await back();check('返回属性塔上级',cat.value==='elementaltower');await back();check('返回副本目录恢复原滚动位置',cat.value==='dungeons'&&maps.scrollTop===dungeonPosition&&dungeonPosition>0);
choose('coopexp');await tick();const seasonPosition=await scroll(60);maps.querySelector('[data-category="coopexp_s1"]').click();await tick();check('合作远征按赛季浏览',cat.value==='coopexp_s1'&&maps.querySelectorAll('[data-map]').length>0);await back();check('返回赛季目录恢复原滚动位置',cat.value==='coopexp'&&maps.scrollTop===seasonPosition);
choose('world_01');await tick();const mapPosition=await scroll(180);const b=maps.querySelector('[data-map]');b.click();await tick();check('选择地图保留列表滚动位置',maps.scrollTop===mapPosition&&mapPosition>0);
choose('categories');$('search').value='冥界有限公司';$('search').dispatchEvent(new Event('input',{bubbles:true}));await tick();check('中文章节名搜索',maps.querySelector('[data-category="story_06"]')&&maps.querySelectorAll('[data-category]').length===1);$('search').value='';$('search').dispatchEvent(new Event('input',{bubbles:true}));await tick();check('清除搜索恢复根目录位置',maps.scrollTop===rootPosition);
choose('all');await tick();check('全部视图须主动选择',maps.querySelectorAll('[data-map]').length===2054);
choose('misc');await tick();maps.querySelector('[data-map="short_story_clevatess_test"]').click();await tick();check('无法解码的测试图明确提示并清空旧图',$('message').textContent.includes('无法使用地图名解密')&&$('stage').dataset.ready==='false'&&$('layers').children.length===0);
choose('world_12');await tick();maps.querySelector('[data-map="demonworld_1_1"]').click();await wait(()=>$('stage').dataset.ready==='true');check('没有静态模型的地图显示明确提示',$('message').textContent.includes('没有可显示的静态模型'));status.textContent='全部通过';document.body.dataset.result='pass';
}catch(e){status.textContent=e.stack;document.body.dataset.result='fail';}
</script>
