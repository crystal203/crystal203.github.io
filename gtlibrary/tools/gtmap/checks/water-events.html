<!doctype html><meta charset="utf-8"><title>水面与标记验证</title><style>body{background:#0f1116;color:#e8ebf1;font:14px system-ui;padding:18px}#host{width:900px;height:560px}li{padding:4px}</style><h1>desert_1_5 原始水面与事件叠加验证</h1><p id="status">检查中</p><ul id="results"></ul><div id="host"></div><script type="module">
import {MapRuntime,decodeMap,assetsForMap} from '../../../gtmap/core.js';
const root=new URL('../../../gtmap/assets/',location.href),out=document.querySelector('#results'),status=document.querySelector('#status');let runtime;function check(text,ok){const li=document.createElement('li');li.textContent=(ok?'PASS · ':'FAIL · ')+text;out.append(li);if(!ok)throw new Error(text);}const json=p=>fetch(new URL(p,root)).then(r=>r.json());const image=p=>new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=new URL(p,root);});
try{const c=await json('catalog.json'),m=c.maps.find(m=>m.id==='desert_1_5'),doc=await decodeMap(await fetch(new URL(m.file,root)).then(r=>r.arrayBuffer()),m.id),pack=await json(m.pack);const waters=doc.layers.flatMap(l=>l.tiles||[]).filter(t=>t.name==='[gimmick]water'),t=waters[0],k=(pack.setOrder.indexOf(doc.tilesets[t.ts-1].name)+1)+':'+t.name;
check('原地图有 32 个水面图块',waters.length===32);check('水面使用 bundle 原始 Water_desert 材质',pack.materials[pack.templates[k].parts[0].materials[0]].name==='Water_desert');
runtime=new MapRuntime(document.querySelector('#host'));const fixture={...doc,layers:[{name:'native water regression',type:0,tiles:[{...t,x:0,y:0,z:0}]},{name:'event regression',type:1,tiles:[],events:[{name:'marker above water',position:[0,0,0]}]}]};await runtime.loadAssets(assetsForMap(pack,fixture),image);await runtime.build(fixture);runtime.setView('oblique');const canvas=document.querySelector('canvas'),gl=canvas.getContext('webgl2');function bluePixels(){const a=new Uint8Array(canvas.width*canvas.height*4);gl.readPixels(0,0,canvas.width,canvas.height,gl.RGBA,gl.UNSIGNED_BYTE,a);let n=0;for(let i=0;i<a.length;i+=4)if(Math.abs(a[i]-147)<4&&Math.abs(a[i+1]-174)<4&&Math.abs(a[i+2]-230)<4)n++;return n;}runtime.setEvents(false);runtime.render();const off=bluePixels();runtime.setEvents(true);runtime.render();const on=bluePixels();check('标记最后绘制，原始不透明水面未覆盖标记（像素验证）',on>off+4);check('水面及标记 GPU 绘制没有 Shader 编译失败',runtime.getDiagnostics().failedPrograms===0);
const crop={...doc,layers:doc.layers.map(l=>l.type===0?{...l,tiles:l.tiles.filter(v=>Math.abs(v.x-t.x)<=12&&Math.abs(v.z-t.z)<=12)}:{...l,events:l.events.filter(v=>Math.abs(v.position[0]-t.x)<=12&&Math.abs(v.position[2]-t.z)<=12)})};await runtime.loadAssets(assetsForMap(pack,crop),image);await runtime.build(crop);runtime.setEvents(true);runtime.render();status.textContent='全部通过 · 原地图水域局部（标记已开启）';document.body.dataset.result='pass';
}catch(e){runtime?.dispose();status.textContent=e.stack;document.body.dataset.result='fail';}
</script>
