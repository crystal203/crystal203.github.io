<!doctype html><meta charset="utf-8"><title>地图原生特效与临时编辑验证</title><style>body{background:#10141b;color:#ddd;font:13px system-ui;margin:16px}#host{width:900px;height:500px}.pass{color:#9ed}.fail{color:#f99}button{padding:7px;margin:4px}pre{white-space:pre-wrap}</style><p id="status">检查中</p><ol id="results"></ol><button id="run-batch">检查全部特效模板</button><button id="dot-scene">展示原始伤害地砖</button><button id="portal-scene">展示原始传送门</button><pre id="report"></pre><div id="host"></div><script type="module">
import {MapRuntime,assetsForMap} from '../../../gtmap/core.js?v=native-effects-2';
import {sampleAnimator} from '../../../core/custom-animator.js?v=native-effects-2';
const root=new URL('../../../gtmap/assets/',location.href),json=async p=>{const r=await fetch(new URL(p,root));if(!r.ok)throw Error('HTTP '+p);return p.endsWith('.gz')?new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).json():r.json();};
const host=document.querySelector('#host'),out=document.querySelector('#results'),status=document.querySelector('#status'),report={};
const runtime=new MapRuntime(host,{onSelection:s=>host.dataset.selected=JSON.stringify(s)}),tick=()=>new Promise(r=>requestAnimationFrame(r));
function check(name,value){const li=document.createElement('li');li.className=value?'pass':'fail';li.textContent=(value?'PASS · ':'FAIL · ')+name;out.append(li);if(!value)throw Error(name);}
const images=new Map(),image=p=>{if(!images.has(p))images.set(p,new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=new URL(p,root);}));return images.get(p);};
let pack,manifest,extra,currentDoc;
async function load(set,names,positions){if(!extra[set])extra[set]=await json(manifest.sets[set]);const doc={version:16,tileCount:names.length,tilesets:[{name:set}],layers:[{type:0,name:'fixture',tiles:names.map((name,i)=>({ts:1,name,x:positions?.[i]??(i-(names.length-1)/2)*5,y:0,z:0,rotation:0,properties:[]}))}]};const assets=assetsForMap({...pack,environment:{effects:{[set]:extra[set]}}},doc);await runtime.loadAssets(assets,image);const built=await runtime.build(doc);runtime.setView('top');runtime.render(.75);currentDoc=doc;return built;}
try{pack=await fetch(new URL('effects-fixtures.json.gz',location.href)).then(r=>new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).json());manifest=await json('native-effects.json');pack.vertexFormats=await json('vertex-formats.json');pack.sortingLayers=(await json('sorting-layers.json')).layers;extra={};
const s2='ondemand/coop_expedition/s2/tilesets:coop_expedition_s2.tileset',s3='ondemand/coop_expedition/s3/tilesets:coop_expedition_s3.tileset';
const built=await load(s3,['[gimmick]dot_tile_3x3','[gimmick]dot_tile_3x3'],[-3,3]);const original=JSON.stringify(currentDoc);check('伤害地砖包含源纹理粒子前景',built.nativeParticleSystems===2&&built.nativeParticleInstances>2);const spec=extra[s3].templates['[gimmick]dot_tile_3x3'];check('使用原始 FX_Iceground 与两张烟状光晕贴图',spec.systems.flatMap(s=>s.modules.UVModule.sprites).map(id=>extra[s3].sprites[id].name).includes('FX_Iceground'));
const canvas=host.querySelector('canvas'),trapGL=canvas.getContext('webgl2'),withSmoke=new Uint8Array(canvas.width*canvas.height*4),withoutSmoke=new Uint8Array(withSmoke.length);runtime.render(.75);trapGL.readPixels(0,0,canvas.width,canvas.height,trapGL.RGBA,trapGL.UNSIGNED_BYTE,withSmoke);runtime.setEnvironment(false);runtime.render(.75);trapGL.readPixels(0,0,canvas.width,canvas.height,trapGL.RGBA,trapGL.UNSIGNED_BYTE,withoutSmoke);let smokePixels=0;for(let i=0;i<withSmoke.length;i+=4)if(Math.abs(withSmoke[i]-withoutSmoke[i])+Math.abs(withSmoke[i+1]-withoutSmoke[i+1])+Math.abs(withSmoke[i+2]-withoutSmoke[i+2])>8)smokePixels++;report.trapSmokePixels=smokePixels;check('原始烟雾前景没有被红色底面遮住',smokePixels>100);runtime.setEnvironment(true);canvas.setPointerCapture=()=>{};canvas.releasePointerCapture=()=>{};const records=runtime.getTileRecords(),state=runtime.getState(),rect=canvas.getBoundingClientRect();function click(x,ctrl=false){const px=rect.left+rect.width*(.5+x/state.viewWidth),py=rect.top+rect.height*.5;for(const type of ['pointerdown','pointerup'])canvas.dispatchEvent(new PointerEvent(type,{button:0,pointerId:77,pointerType:'mouse',clientX:px,clientY:py,ctrlKey:ctrl,bubbles:true}));}
click(-3);check('左键拾取物块并显示选框',runtime.getSelection().length===1);click(3,true);check('Ctrl 左键选择集合',runtime.getSelection().length===2);click(3,true);check('Ctrl 左键可移除选中',runtime.getSelection().length===1);runtime.selectTiles(records.map(r=>r.id));const before=runtime.getSelection();runtime.editSelection({move:[2,4,6]});check('多选移动以地图坐标执行',runtime.getSelection().every((t,i)=>t.position.every((v,k)=>Math.abs(v-before[i].position[k]-[2,4,6][k])<1e-7)));runtime.editSelection({rotate:[0,90,0],scale:[2,2,2]});const transformed=runtime.getSelection();check('集合围绕共同中心旋转与缩放',Math.abs(transformed[0].position[0]-transformed[1].position[0])<1e-6&&Math.abs(Math.abs(transformed[0].position[2]-transformed[1].position[2])-12)<1e-6&&transformed.every(t=>t.rotation===90&&t.scale.every(v=>v===2)));runtime.editSelection({visible:false});check('隐藏后保持选择以便重新显示',runtime.getSelection().every(t=>!t.visible));runtime.editSelection({visible:true});check('可以恢复显示',runtime.getSelection().every(t=>t.visible));runtime.resetEdits();check('还原所有选中物块',JSON.stringify(runtime.getSelection().map(t=>[t.position,t.rotation,t.scale]))===JSON.stringify(before.map(t=>[t.position,t.rotation,t.scale])));check('源地图没有任何变更',JSON.stringify(currentDoc)===original);runtime.editSelection({rotate:[15,0,0]});runtime.resetEdits(true);runtime.render(2.2);check('编辑后的 GPU 材质无编译失败',runtime.getDiagnostics().failedPrograms===0);
await load(s2,['[GIMMICK]new_portal_enter'],[0]);check('切换地图清除临时修改和选择',runtime.getSelection().length===0&&runtime.getTileRecords().every(t=>t.visible));const animator=extra[s2].templates['[GIMMICK]new_portal_enter'].staticScripts['mesh_aura_ray (1)'].find(s=>s.type==='CustomAnimator').fields;const color=sampleAnimator(animator,20).find(c=>c.key===17);check('传送门在循环状态保留源紫色',color&&Math.abs(color.vector[0]-.8)<1e-6&&Math.abs(color.vector[1]-.4)<1e-6);runtime.render(20);const gl=canvas.getContext('webgl2'),pixels=new Uint8Array(canvas.width*canvas.height*4);gl.readPixels(0,0,canvas.width,canvas.height,gl.RGBA,gl.UNSIGNED_BYTE,pixels);let purple=0,white=0;for(let i=0;i<pixels.length;i+=4){if(pixels[i+2]>pixels[i+1]*1.3&&pixels[i]>pixels[i+1]*1.2&&pixels[i]>25)purple++;if(pixels[i]>220&&pixels[i+1]>220&&pixels[i+2]>220)white++;}report.portalPixels={purple,white};report.diagnostics=runtime.getDiagnostics();runtime.setEnvironment(false);runtime.render(20);gl.readPixels(0,0,canvas.width,canvas.height,gl.RGBA,gl.UNSIGNED_BYTE,pixels);let staticWhite=0;for(let i=0;i<pixels.length;i+=4)if(pixels[i]>220&&pixels[i+1]>220&&pixels[i+2]>220)staticWhite++;report.staticWhite=staticWhite;runtime.setEnvironment(true);check('原生紫色传送门没有白色圆环覆盖',purple>100&&white<purple*.05);check('传送门 Shader 编译成功',runtime.getDiagnostics().failedPrograms===0);status.textContent='交互与原生贴图检查通过';document.body.dataset.result='pass';
document.querySelector('#dot-scene').onclick=async()=>{await load(s3,['[gimmick]dot_tile_3x3'],[0]);runtime.setView('oblique');runtime.actualSize();runtime.zoom(3);};document.querySelector('#portal-scene').onclick=async()=>{await load(s2,['[GIMMICK]new_portal_enter'],[0]);runtime.setView('oblique');runtime.actualSize();runtime.zoom(3);};
document.querySelector('#run-batch').onclick=async()=>{try{let total=0,systems=0;const empty=[],fail=[];for(const [set,path] of Object.entries(manifest.sets)){if(!extra[set])extra[set]=await json(path);for(const name of Object.keys(extra[set].templates)){status.textContent='GPU 模板 '+(++total)+' · '+name;const b=await load(set,[name],[0]);runtime.render(2.2);if(runtime.getDiagnostics().failedPrograms)fail.push({set,name});if(!b.nativeParticleInstances&&!b.instanceCount)empty.push({set,name});systems+=b.nativeParticleSystems;await tick();}}report.batch={total,systems,empty,fail};check('全部原生特效模板 GPU 编译通过',total>=471&&fail.length===0);runtime.clear();await tick();check('清空后释放全部地图几何体',runtime.getDiagnostics().geometries===0);document.body.dataset.batch='pass';status.textContent='全部通过 · '+total+' 个模板';document.querySelector('#report').textContent=JSON.stringify(report,null,2);}catch(e){status.textContent=e.stack;document.body.dataset.batch='fail';}};
}catch(e){status.textContent=e.stack;document.body.dataset.result='fail';}document.querySelector('#report').textContent=JSON.stringify(report,null,2);
</script>
