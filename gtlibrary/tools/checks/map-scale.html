<!doctype html><meta charset="utf-8"><title>地图原始尺度验证</title><style>body{background:#111;color:white;font:14px system-ui}#host{width:900px;height:600px}canvas{display:block}</style><p id="status">检查中</p><ol id="results"></ol><div id="host"></div><script type="module">
import {MapRuntime} from '../../gtmap/core.js';const host=document.querySelector('#host'),out=document.querySelector('#results');const r=new MapRuntime(host);const tick=()=>new Promise(resolve=>requestAnimationFrame(resolve));function check(n,v){const li=document.createElement('li');li.textContent=(v?'PASS · ':'FAIL · ')+n;out.append(li);if(!v)throw Error(n);}const doc=size=>({tilesets:[{name:'test'}],tileCount:2,layers:[{name:'floor',type:0,tiles:[{ts:1,name:'empty',x:0,y:0,z:0,rotation:0},{ts:1,name:'empty',x:size,y:0,z:size,rotation:0}]}]});try{await r.loadAssets({setOrder:['test'],templates:{'1:empty':{name:'empty',parts:[]}},textures:{},materials:{},meshes:{}},()=>{});await r.build(doc(10));const small=r.getState().zoom;r.actualSize();let s=r.getState();check('100% 时每格 32 CSS 像素',Math.abs(s.viewportWidth/s.viewWidth-32)<.001&&s.zoom===1);await r.build(doc(300));const large=r.getState().zoom;check('不同尺寸地图的适配百分比不同',large<small/20);r.actualSize();s=r.getState();check('大地图的 100% 使用相同原始尺度',Math.abs(s.viewportWidth/s.viewWidth-32)<.001);host.style.width='500px';host.style.height='350px';await tick();await tick();s=r.getState();check('改变窗口大小保持每格像素尺度',Math.abs(s.viewportWidth/s.viewWidth-32)<.001);r.setView('top');check('俯视自动关闭 Unity 并保留比例',!r.getState().unityView&&r.getState().zoom===1);r.setView('oblique');check('斜视自动开启 Unity 并保留比例',r.getState().unityView&&r.getState().zoom===1);r.fit();check('小窗口可完整适配大地图',r.getState().zoom<.03);document.body.dataset.result='pass';document.querySelector('#status').textContent='全部通过';}catch(e){document.body.dataset.result='fail';document.querySelector('#status').textContent=e.stack;}finally{r.dispose();}
</script>
