<!doctype html><meta charset="utf-8"><title>合作远征暗红地砖原生动画验证</title><style>body{background:#111;color:#eee;font:14px system-ui}#host{width:800px;height:500px}li{padding:4px}</style><p id="status">检查中</p><ol id="results"></ol><pre id="report"></pre><div id="host"></div><script type="module">
import {MapRuntime,decodeMap,assetsForMap} from '../../gtmap/core.js';const root=new URL('../../gtmap/assets/',location.href),json=async p=>{const r=await fetch(new URL(p,root));return p.endsWith('.gz')?new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).json():r.json();},out=document.querySelector('#results');let runtime;const report={};function check(n,v){const li=document.createElement('li');li.textContent=(v?'PASS · ':'FAIL · ')+n;out.append(li);if(!v)throw Error(n);}
try{const catalog=await json('catalog.json'),m=catalog.maps.find(m=>m.id==='coop_exp_s3_battle_1_hard'),doc=await decodeMap(await fetch(new URL(m.file,root)).then(r=>r.arrayBuffer()),m.id),pack=await json(m.pack),animators=await json('native-animations.json');const tile=doc.layers.flatMap(l=>l.tiles||[]).find(t=>t.name==='[gimmick]dot_tile_3x3');check('原地图包含用户指出的地砖',!!tile);const key=pack.setOrder.indexOf(doc.tilesets[tile.ts-1].name)+1+':'+tile.name;const part=pack.templates[key].parts[0],animation=animators[doc.tilesets[tile.ts-1].name][tile.name][part.node];check('暗红色取自源动画曲线',animation.States[0].Curves.find(c=>c.Key===6).EndValue>.16&&animation.States[0].Curves.find(c=>c.Key===7).EndValue===0);const fixture={...doc,tileCount:1,layers:[{name:'source dot',type:0,tiles:[{...tile,x:0,y:0,z:0}]}]};runtime=new MapRuntime(document.querySelector('#host'));await runtime.loadAssets(assetsForMap({...pack,environment:{...pack.environment,animators}},fixture),p=>new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=reject;image.src=new URL(p,root);}));const built=await runtime.build(fixture);runtime.setView('top');check('核心识别源材质动画',built.nativeAnimatedMaterials===1);const canvas=document.querySelector('canvas'),gl=canvas.getContext('webgl2');function pixels(t){runtime.render(t);const data=new Uint8Array(canvas.width*canvas.height*4);gl.readPixels(0,0,canvas.width,canvas.height,gl.RGBA,gl.UNSIGNED_BYTE,data);let red=0,white=0;for(let i=0;i<data.length;i+=4){if(data[i]>25&&data[i]>data[i+1]*2&&data[i]>data[i+2]*2)red++;if(data[i]>180&&data[i+1]>180&&data[i+2]>180)white++;}return {red,white};}report.start=pixels(0);report.fading=pixels(.25);report.final=pixels(.75);report.loop=pixels(1.25);check('GPU 像素从透明淡入暗红色',report.start.red===0&&report.fading.red>100&&report.final.red>=report.fading.red);check('修复后没有白色方块',report.final.white===0);check('进入循环状态后颜色保持原生值',report.loop.red===report.final.red);check('GPU Shader 无编译失败',runtime.getDiagnostics().failedPrograms===0);document.querySelector('#status').textContent='全部通过';document.body.dataset.result='pass';}catch(e){document.querySelector('#status').textContent=e.stack;document.body.dataset.result='fail';report.error=e.message;}document.querySelector('#report').textContent=JSON.stringify(report,null,2);
</script>
