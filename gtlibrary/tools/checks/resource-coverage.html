<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>静态资源覆盖验证</title><style>body{background:#111;color:#eee;font:14px system-ui}iframe{width:1200px;height:720px;border:0}</style><h1>资源覆盖验证</h1><p id="status">检查中</p><ol id="results"></ol><pre id="report"></pre><iframe id="library" src="../../index.html"></iframe>
<script src="../../core/cache-version.js"></script><script src="../../core/delivery-config.js"></script><script src="../../core/delivery.js"></script><script src="../../core/resources.js"></script><script src="../../core/resource-catalog.js"></script><script src="../../core/registry.js"></script><script src="../../vendor/spine-webgl.js?v=3.8-utf8"></script><script src="../../gtasset/core.js"></script><script type="module">
const out=document.querySelector('#results'),report={checks:[],jp:[],media:{}},frame=document.querySelector('iframe'),tick=()=>new Promise(r=>requestAnimationFrame(r));
function check(name,value){const li=document.createElement('li');li.textContent=(value?'PASS · ':'FAIL · ')+name;out.append(li);report.checks.push({name,pass:!!value});if(!value)throw Error(name);}
async function wait(fn){let start=performance.now();while(!fn()){if(performance.now()-start>60000)throw Error('timeout');await tick();}}
try{
 const [index,registry,jp,maps]=await Promise.all([GTResourceCatalog.load(),GTRegistry.load(),fetch('../../resources/illust-jp/catalog.json').then(r=>r.json()),fetch('../../gtmap/assets/catalog.json').then(r=>r.json())]);
 check('20 个图集共用目录',index.sheets.length===20);check('所有图集非空条目可检索',Object.values(index.counts.atlasRegions).reduce((a,b)=>a+b,0)===index.entities.filter(e=>e.kind==='atlasRegion').length);
 check('全部地图都生成主搜索入口',maps.maps.length===2054);check('94 个日服立绘拥有真实骨骼入口',jp.illustrations.length===94&&jp.illustrations.every(r=>registry.entities[r.id]?.spine?.name===r.name));
 for(const row of jp.illustrations){const [atlasText,bytes]=await Promise.all([GTResources.fetch('../../resources/spine/illust/'+row.name+'.atlas').then(r=>{if(!r.ok)throw Error(r.status);return r.text();}),GTResources.fetch('../../resources/spine/illust/'+row.name+'.bytes').then(r=>{if(!r.ok)throw Error(r.status);return r.arrayBuffer();})]);const atlas=new spine.TextureAtlas(atlasText,()=>({setFilters(){},setWraps(){},getImage(){return {width:2048,height:2048};},dispose(){}}));const data=new spine.SkeletonBinary(new spine.AtlasAttachmentLoader(atlas)).readSkeletonData(new Uint8Array(bytes));const skeleton=GTSpineCore.createInstance(spine,data);skeleton.updateWorldTransform();report.jp.push({id:row.id,bones:data.bones.length,slots:data.slots.length,animations:data.animations.map(a=>a.name)});atlas.dispose();await tick();}
 check('94 个日服立绘均通过真实 Spine 二进制解析',report.jp.length===94&&report.jp.every(r=>r.bones>0&&r.slots>0));
 for(const mime of ['video/mp4;codecs=avc1.42001E','video/mp4','video/quicktime','video/webm;codecs=vp9'])report.media[mime]=typeof MediaRecorder!=='undefined'&&MediaRecorder.isTypeSupported(mime);
 report.media.webCodecs=typeof VideoEncoder!=='undefined';if(report.media.webCodecs){for(const codec of ['avc1.42001E','vp09.00.10.08','hvc1.1.6.L93.B0'])try{report.media[codec]=(await VideoEncoder.isConfigSupported({codec,width:512,height:512,bitrate:2000000,framerate:30})).supported;}catch{report.media[codec]=false;}}
 await wait(()=>frame.contentDocument?.querySelector('#library-search'));const d=frame.contentDocument,$=id=>d.getElementById(id);const query=async value=>{$('library-search').value=value;$('search-form').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));await wait(()=>$('results').querySelector('button'));};
 await query('desert_1_5');check('主搜索包含 desert_1_5',!![...$('results').querySelectorAll('small')].find(e=>e.textContent==='desert_1_5'));
 const target=index.entities.find(e=>e.kind==='atlasRegion'&&e.atlas.sheet==='battle');await query(target.aliases[0]);const button=[...$('results').querySelectorAll('button')].find(b=>b.querySelector('small')?.textContent===target.id);check('战斗 UI 图集条目出现在主搜索',!!button);button.click();await wait(()=>d.querySelector('iframe')?.contentDocument?.querySelector('#regionList')?.children.length);const ad=d.querySelector('iframe').contentDocument;check('主搜索打开正确图集和精确条目',ad.querySelector('#spritesheetSelect option:checked').textContent==='战斗UI'&&ad.querySelector('#searchInput').value===target.atlas.query);
 await query('illust_admiral_kong');check('主搜索能找到指定日服立绘',!![...$('results').querySelectorAll('small')].find(e=>e.textContent==='admiral_kong'));
 report.counts=index.counts;document.querySelector('#status').textContent='全部通过';document.body.dataset.result='pass';
}catch(e){document.querySelector('#status').textContent=e.stack;document.body.dataset.result='fail';report.error=e.message;}
document.querySelector('#report').textContent=JSON.stringify(report,null,2);
</script></html>
