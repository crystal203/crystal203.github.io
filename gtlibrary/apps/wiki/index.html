<!doctype html>
<html lang="zh-CN">
<head>
  <script>if(window===window.top){const p=new URLSearchParams(location.search);p.set('view','wiki');location.replace('../../index.html#'+p);}</script>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GTWiki · 角色图鉴</title><link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wiki-shell">
    <aside class="directory" aria-label="角色目录">
      <header class="directory-heading"><h1>角色图鉴 <small>GTWIKI</small></h1></header>
      <div class="filters">
        <label class="search-box"><span aria-hidden="true">⌕</span><input id="hero-search" type="search" aria-label="搜索角色" placeholder="搜索角色" autocomplete="off"></label>
        <div class="filter-row"><label>职业<select id="role-filter"><option value="">全部职业</option><option>战士</option><option>射手</option><option>坦克</option><option>辅助</option></select></label><label>初始星级<select id="star-filter"><option value="">全部星级</option><option value="1">1 星</option><option value="2">2 星</option><option value="3">3 星</option></select></label></div>
        <div id="element-filter" class="element-filters" role="group" aria-label="属性筛选"></div>
        <div class="list-meta"><span id="hero-count" role="status">正在读取目录…</span><button id="reset-filters" type="button">重置</button></div>
      </div>
      <div id="hero-list" class="hero-list"></div>
    </aside>
    <main id="detail-scroll" class="detail-scroll">
      <p id="page-status" role="status">正在打开角色图鉴…</p>
      <article id="hero-detail" hidden>
        <header class="hero-heading"><div><div id="hero-tags" class="tags"></div><h2 id="hero-name"></h2><p id="hero-english" class="english-name"></p></div><button id="copy-link" type="button">复制角色链接</button></header>
        <nav class="section-nav" aria-label="详情章节"><a href="#overview">概览</a><a href="#skills">技能</a><a href="#awakening">觉醒</a><a href="#appearance">星级与时装</a><a href="#weapons">专属武器</a><a href="#story">背景故事</a></nav>
        <section id="overview" class="overview">
          <div class="illustration-panel panel"><div class="panel-top"><h3>角色立绘</h3><select id="illust-select" aria-label="立绘版本"></select></div><div id="illust-stage" class="illust-stage"></div><div class="media-toolbar"><button id="illust-pause">暂停动画</button><button id="illust-reset">复位</button><button id="illust-retry">重试</button><label>缩放<input id="illust-zoom" type="range" min="50" max="200" value="100" aria-label="立绘缩放"></label><button id="illust-open">在立绘查看器打开 ↗</button></div></div>
          <div class="overview-info"><section class="panel biography"><h3>人物信息</h3><p id="hero-description" class="hero-description"></p><dl id="profile-fields" class="profile-fields"></dl><blockquote id="hero-introduction"></blockquote></section>
          <section class="panel stats-panel"><div class="panel-top"><h3>角色属性</h3><select id="stats-stage" aria-label="属性星级"></select></div><label class="level-control">等级 <input id="hero-level" type="number" min="1" max="105" step="1" value="100" aria-label="人物等级"><span id="hero-level-range" class="note"></span></label><div id="stat-values" class="stat-values"></div><p class="note">基础属性 · 未觉醒</p><h4 class="party-title">队伍能力</h4><div id="party-values"></div></section></div>
        </section>
        <section id="skills" class="content-section"><div class="section-heading"><h3>技能</h3><select id="skill-set" aria-label="专武技能版本"></select></div><div id="hero-skills" class="combat-grid"></div></section>
        <section id="awakening" class="content-section"><div class="section-heading"><h3>觉醒树</h3><span id="awakening-count" class="section-note"></span></div><div id="awakening-tree"></div></section>
        <section id="appearance" class="content-section"><div class="section-heading"><h3>星级与时装</h3><span id="appearance-count" class="section-note"></span></div><div class="appearance-layout"><div><h4>进化形态</h4><div id="evolution-list" class="appearance-grid"></div><h4>时装</h4><div id="costume-list" class="appearance-grid"></div></div><div class="panel pixel-panel"><div class="panel-top"><h4 id="pixel-name">像素动画</h4><select id="pixel-direction" aria-label="像素小人朝向"><option value="front">正面</option><option value="back">背面</option><option value="side">侧面</option></select></div><div id="pixel-stage" class="pixel-stage"></div><div class="media-toolbar"><button id="pixel-pause">暂停</button><button id="pixel-retry">重试</button><button id="pixel-open">在像素查看器打开 ↗</button></div></div></section>
        <section id="weapons" class="content-section"><div class="section-heading"><h3>专属武器</h3><span id="weapon-count" class="section-note"></span></div><label class="level-control">等级 <input id="weapon-level" type="number" min="1" max="105" step="1" value="100" aria-label="武器等级"><span id="weapon-level-range" class="note"></span></label><div id="weapon-list" class="weapon-grid"></div></section>
        <section id="story" class="content-section"><div class="section-heading"><h3>背景故事</h3></div><div class="panel story-panel"><div id="hero-story"></div></div></section>
      </article>
    </main>
  </div>
  <script src="../../core/cache-version.js"></script><script src="../../core/delivery-config.js"></script><script src="../../core/delivery.js"></script><script src="../../core/resources.js?v=20261011-wiki"></script><script src="../../core/bridge.js"></script><script src="../../core/wiki-catalog.js"></script><script src="../../gtatlas/core.js"></script><script src="../../gtasset/core.js"></script><script src="../../vendor/spine-webgl.js?v=3.8-utf8"></script><script type="module" src="app.js"></script>
</body></html>
