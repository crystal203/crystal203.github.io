<!doctype html><html lang="zh-CN"><head><script>if(window===window.top){const p=new URLSearchParams(location.search);p.set('view','map');location.replace('../../index.html#'+p);}</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>坎公地图</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../../shared/theme.css"></head>
<body data-app="map"><header><button id="menu" aria-label="选择地图">☰</button><strong>坎公地图</strong><span id="current-map">选择地图</span><button id="open-file">打开文件</button><input id="file" type="file" accept=".bytes,.tilemap" hidden></header>
<main><aside id="sidebar"><input id="search" type="search" placeholder="搜索地图、章节或编号" aria-label="搜索地图"><select id="category" aria-label="地图分类"><option value="categories">分类浏览</option><option value="all">全部地图</option></select><div class="category-nav"><button id="back-category" hidden>‹ 分类</button><span id="category-title">选择分类</span></div><div id="maps" tabindex="0" aria-label="地图分类"></div><small id="count"></small></aside>
<section class="workspace"><div class="toolbar"><button id="view-oblique" aria-pressed="true">斜视</button><button id="view-top" aria-pressed="false">俯视</button><label><input id="unity" type="checkbox" checked>Unity 斜投影</label><button id="fit">适配</button><button id="minus" aria-label="缩小">−</button><button id="zoom" title="原始比例：每格 32 CSS 像素；点击恢复 100%" aria-label="恢复原始比例">100%</button><button id="plus" aria-label="放大">＋</button></div>
<div id="stage" aria-label="地图画面"><div id="message" role="status">正在加载地图目录…</div><button id="retry" hidden>重试</button><section id="inspector" hidden><button id="close-inspector" aria-label="关闭图块信息">×</button><h3 id="tile-name"></h3><dl id="tile-info"></dl><section id="tile-edit"><p id="selection-count"></p><div class="edit-actions"><button id="hide-tiles">隐藏</button><button id="show-tiles">显示</button><button id="reset-tiles">还原选中</button><button id="reset-all-tiles">还原全部</button></div>
<fieldset><legend>移动增量（地图坐标）</legend><div class="edit-vector"><label>X<input id="move-x" type="number" step=".5" value="0"></label><label>Y<input id="move-y" type="number" step=".5" value="0"></label><label>Z<input id="move-z" type="number" step=".5" value="0"></label></div><button id="move-tiles">移动</button></fieldset>
<fieldset><legend>旋转增量（度）</legend><div class="edit-vector"><label>X<input id="rotate-x" type="number" step="15" value="0"></label><label>Y<input id="rotate-y" type="number" step="15" value="0"></label><label>Z<input id="rotate-z" type="number" step="15" value="0"></label></div><button id="rotate-tiles">旋转</button></fieldset>
<fieldset><legend>缩放倍数</legend><div class="edit-vector"><label>X<input id="scale-x" type="number" min=".01" step=".1" value="1"></label><label>Y<input id="scale-y" type="number" min=".01" step=".1" value="1"></label><label>Z<input id="scale-z" type="number" min=".01" step=".1" value="1"></label></div><button id="scale-tiles">缩放</button></fieldset>
<small>Ctrl＋左键增减选中。集合围绕共同中心变换。隐藏后仍可在此显示；微调仅用于当前展示，切换地图后清除。</small><p id="edit-message" role="status"></p></section><details><summary>组件属性</summary><pre id="tile-props"></pre></details></section></div>
<div class="transport"><label><input id="environment" type="checkbox" checked>地图特效</label><label><input id="events" type="checkbox">事件标记</label><label>亮度<input id="brightness" type="range" min=".5" max="2" step=".05" value="1" aria-label="亮度"></label><span id="stats"></span></div><details id="layer-options"><summary>图层</summary><div id="layers"></div></details><footer>中键平移 · 右键旋转 · 滚轮缩放 · 左键选取 · Ctrl 多选 · F 适配<span id="quality"></span></footer></section></main>
<script src="../../core/cache-version.js"></script><script src="../../core/delivery-config.js"></script><script src="../../core/delivery.js"></script><script src="../../core/resources.js"></script><script src="../../core/map-catalog.js"></script><script src="../../core/bridge.js"></script><script type="module" src="app.js"></script></body></html>
