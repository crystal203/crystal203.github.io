<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>动画 · GTVideo</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../../gtmap/dialogue.css"><link rel="stylesheet" href="../../shared/favorites.css"></head>
<body>
<header class="topbar"><strong>动画 <span>GTVideo</span></strong><select id="projects" aria-label="本地项目"></select><button id="new-project" title="新建项目">＋ 项目</button><input id="project-name" aria-label="项目名称" maxlength="120"><span id="save-state" role="status"></span><div class="spacer"></div><button id="import-project">导入 JSON</button><button id="save-json">导出 JSON</button><button id="export-video" class="primary">导出 MP4</button><button id="delete-project" title="删除当前本地项目" aria-label="删除当前项目">×</button><input id="project-file" type="file" accept=".json,application/json" hidden></header>
<main>
 <aside class="browser"><nav id="asset-tabs"><button data-tab="shots" aria-selected="true">镜头</button><button data-tab="maps">地图</button><button data-tab="people">人物</button><button data-tab="objects">物件</button><button data-tab="audio">音频</button></nav><div class="browser-tools"><input id="asset-search" type="search" placeholder="搜索镜头" aria-label="搜索资源"><button id="asset-favorites" title="只看收藏" aria-label="只看收藏" aria-pressed="false">★</button><button id="add-shot" title="新建镜头">＋</button></div><label id="map-characters" hidden><input id="include-characters" type="checkbox" checked>导入地图人物</label><div id="assets"></div><div class="browser-footer"><button id="paste-object">粘贴物件 / 人物</button><a href="../../index.html#view=spine" target="_blank" rel="noopener">GTAsset ↗</a></div></aside>
 <section class="viewer"><div class="viewbar"><div class="switch"><button id="mode-project" aria-pressed="true">项目</button><button id="mode-shot" aria-pressed="false">镜头</button></div><span id="view-title"></span><div class="spacer"></div><button id="lock-view" aria-pressed="false" title="固定默认 45°俯视方向，仍可平移和缩放">锁定视角</button><button id="preview-camera" aria-pressed="false">预览摄像头</button><button id="capture-camera" title="将当前预览视角设为主摄像头">设为主相机 ◆</button><button id="toggle-inspector" title="显示或隐藏属性">属性</button></div><div id="edit-tools"><div class="transform-modes"><button data-transform="select" title="选取 Q">选取</button><button data-transform="translate" aria-pressed="true" title="移动 W">移动</button><button data-transform="rotate" title="旋转 E">旋转</button><button data-transform="scale" title="缩放 R">缩放</button></div><label><input id="transform-snap" type="checkbox">吸附</label><label class="position-step-option">分度<input id="position-step" type="number" min=".000001" step="any" value=".1" aria-label="位置最小分度"></label><button id="copy-object">复制</button><button id="paste-inline">粘贴</button><button id="hide-object">隐藏</button><button id="show-object">显示</button><div class="spacer"></div><label title="将属性修改写入当前时间的轨道"><input id="auto-key" type="checkbox">自动</label><button id="sync-object" title="将所选对象的属性同步到当前时间">同步到时间轴 ◆</button></div><div id="preview"><div id="picture"><div id="scenes"></div><canvas id="composition" width="1280" height="720" aria-label="动画预览"></canvas><div id="empty-preview">新建镜头</div></div></div><div class="transport"><button id="go-start" aria-label="回到起点">|‹</button><button id="frame-back" aria-label="上一帧">‹</button><button id="play" class="play" aria-label="播放">▶</button><button id="frame-next" aria-label="下一帧">›</button><input id="time" type="number" value="0" min="0" step=".033333" aria-label="当前时间"><output id="clock">/ 00:00.000</output><div class="spacer"></div><div class="timeline-zoom-controls"><button id="timeline-zoom-out" aria-label="缩小时间轴" title="缩小 −">−</button><input id="timeline-zoom" type="range" min="0" max="1000" step="1" value="500" aria-label="时间轴缩放" title="时间轴比例尺，Ctrl + 滚轮缩放"><button id="timeline-zoom-in" aria-label="放大时间轴" title="放大 +">＋</button><output id="timeline-scale"></output><button id="timeline-fit" title="显示完整时间轴 ">全长</button><button id="timeline-fit-selection" title="放大选中的关键帧或片段" disabled>选中</button></div><button id="toggle-timeline" title="显示或隐藏时间轴">时间轴</button></div></section>
 <div id="inspector-resize" role="separator" tabindex="0" aria-label="调整属性面板宽度" aria-orientation="vertical"></div><aside id="inspector"><div class="inspector-heading">属性<button id="undo" title="撤销 Ctrl+Z">↶</button><button id="redo" title="重做 Ctrl+Shift+Z">↷</button></div><div id="fields"></div></aside>
 <section id="timeline"><div id="timeline-resize" role="separator" tabindex="0" aria-label="调整时间轴高度" aria-orientation="horizontal"></div><div class="timeline-toolbar"><strong id="timeline-title">主时间轴</strong><input id="track-filter" type="search" placeholder="筛选轨道" aria-label="筛选轨道"><select id="track-target" aria-label="轨道对象"></select><select id="track-property" aria-label="轨道"></select><button id="insert-key">◆ 关键帧</button><button id="insert-segment">＋ 片段</button><select id="audio-target" aria-label="音轨集合"></select><button id="add-audio-track">＋ 音轨</button><div class="spacer"></div><label class="timeline-snap-option" title="吸附到播放头、关键帧和片段端点；Alt 临时关闭"><input id="timeline-snap" type="checkbox" checked>磁吸</label><output id="timeline-selection" hidden></output><button id="split" title="截断区间或插入关键帧 K">截断 K</button><button id="copy-frames" title="复制帧 Ctrl+C">复制</button><button id="paste-frames" title="粘贴到播放头 Ctrl+V" disabled>粘贴</button><button id="merge-frames" disabled>合并</button><button id="duplicate" title="连续复制 Ctrl+D">副本</button><button id="remove">删除</button></div><div id="folded-tracks" aria-label="折叠轨道" hidden></div><div id="timeline-scroll" tabindex="0" aria-label="时间轴，空白处拖动框选，Ctrl 点选，Shift 连选"><div id="timeline-content"><div id="ruler"></div><div id="lanes"></div><div id="playhead"></div><div id="snap-guide" hidden></div><div id="timeline-marquee" hidden></div></div></div></section>
</main>
<footer><span id="status" role="status"></span><progress id="progress" max="1" hidden></progress><button id="cancel-export" hidden>取消导出</button></footer>
<dialog id="export-dialog"><form id="export-form"><h2>导出 MP4</h2><label>开始 / s<input name="start" type="number" min="0" step="any" required></label><label>结束 / s<input name="end" type="number" min="0" step="any" required></label><label>宽度<input name="width" type="number" min="64" max="3840" step="2" required></label><label>高度<input name="height" type="number" min="64" max="2160" step="2" required></label><label>帧率<select name="fps"><option>24</option><option>25</option><option>30</option><option>60</option></select></label><label>视频码率 · Mbps<input name="bitrate" type="number" min=".1" max="80" step=".1" required></label><div class="dialog-actions"><button type="button" id="close-export">取消</button><button type="submit" class="primary">导出</button></div></form></dialog>
<script src="../../core/cache-version.js"></script><script src="../../core/delivery-config.js"></script><script src="../../core/delivery.js"></script><script src="../../core/resources.js"></script><script src="../../core/map-catalog.js"></script><script src="../../core/aliases.js"></script><script src="../../core/favorites.js"></script><script src="../../gtatlas/core.js"></script><script src="../../core/registry.js"></script><script src="../../core/bridge.js"></script><script type="module" src="app.js"></script>
</body></html>
