<html lang="zh-CN"><head><script>if(window===window.top){const p=new URLSearchParams(location.search);p.set('view','audio');location.replace('../../index.html#'+p);}</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>音频 · 坎公资源库</title><link rel="stylesheet" href="../../shared/theme.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../../shared/favorites.css"></head>

<main><section class="browser" aria-label="音频目录"><form id="filters"><label class="search">内码搜索<input id="query" type="search" placeholder="bgm_forest / 02_gimmick_door" autocomplete="off"></label><label>分类<select id="kind"><option value="">全部</option><option value="music">BGM</option><option value="sfx">音效</option><option value="voice">语音</option></select></label><label>资源组<select id="group"><option value="">全部资源组</option></select></label></form>
