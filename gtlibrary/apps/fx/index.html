<!doctype html>
<html lang="zh-CN">
<head><script>if(window===window.top){const p=new URLSearchParams(location.search);p.set('view','fx');location.replace('../../index.html#'+p);}</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>坎公特效</title><link rel="icon" href="../../../favicon.ico"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../../shared/theme.css"></head>
<body data-app="fx">
<header><button id="menu" class="mobile" aria-label="选择角色">☰</button><strong>坎公特效</strong><span id="current-character"></span><button id="info" title="资源信息" aria-label="资源信息">ⓘ</button></header>
<main>
<aside id="sidebar"><input id="search" type="search" placeholder="搜索角色" aria-label="搜索角色"><div id="characters" aria-label="角色列表"></div><small id="count"></small></aside>
<section class="workspace">
<div class="effect-bar"><label class="effect-choice">特效<select id="effect" aria-label="特效" disabled></select></label><span id="quality" hidden>近似</span><button id="all" disabled>全部播放</button></div>
<div id="stage" class="checker"><canvas id="canvas" aria-label="特效画面"></canvas><div id="message" role="status">加载中</div></div>
<div class="transport"><button id="replay" aria-label="重播" title="重播" disabled>↺</button><button id="play" disabled>播放</button><button id="step" aria-label="下一帧" title="下一帧" disabled>▹│</button><label><input id="loop" type="checkbox" checked>循环</label><select id="speed" aria-label="速度"><option value=".25">0.25×</option><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select><button id="fit">适配</button><select id="preview-background" aria-label="预览背景"><option value="checker">棋盘背景</option><option value="color">纯色背景</option></select><input id="preview-color" type="color" value="#64615d" aria-label="预览背景颜色" hidden><input id="zoom" type="range" min=".25" max="6" step=".01" value="1" aria-label="缩放"></div>
<div class="timeline"><output id="time">0.000</output><input id="seek" type="range" min="0" max="1" step=".001" value="0" aria-label="播放时间"><output id="duration">0.000 s</output></div>
<div class="export-bar"><strong>GIF</strong><select id="background" aria-label="背景"><option value="transparent">透明</option><option value="color">颜色幕布</option></select><input id="color" type="color" value="#00ff00" aria-label="幕布颜色" hidden><select id="size" aria-label="GIF 尺寸"><option value="native">原始尺寸</option><option value="256">256 px</option><option value="512" selected>512 px</option><option value="768">768 px</option><option value="1024">1024 px</option></select><label id="native-scale-label" hidden>倍率 <input id="native-scale" type="number" min=".25" max="8" step=".25" value="1" aria-label="原始尺寸倍率"></label><output id="native-dimensions" hidden aria-label="导出尺寸"></output><select id="fps" aria-label="GIF 帧率"><option value="15">15 fps</option><option value="20" selected>20 fps</option><option value="30">30 fps</option></select><button id="export" class="primary" disabled>导出 GIF</button><a id="download-gif" hidden download>保存 GIF</a><output id="export-status" role="status"></output><button id="cancel" hidden>取消</button><progress id="progress" max="1" value="0" hidden></progress></div>
<details class="options"><summary>设置</summary><div><label>起始 <input id="start" type="number" min="0" step=".01" value="0"> s</label><label>结束 <input id="end" type="number" min=".01" step=".01" value="1"> s</label><label>种子 <input id="seed" type="number" min="0" step="1" value="12345"></label><label>透明阈值 <input id="threshold" type="range" min="1" max="128" step="1" value="16"></label><label>视角 <select id="view"><option value="unity">Unity · 45°</option><option value="top">俯视</option></select></label><label><input id="grid" type="checkbox">网格</label></div><div id="layers" class="layers"></div></details>
</section></main>
<dialog id="info-dialog"><div class="dialog-head"><strong>资源信息</strong><button id="close-info" aria-label="关闭">×</button></div><pre id="info-text"></pre></dialog>
<script src="../../core/resources.js"></script><script src="../../core/bridge.js"></script><script type="module" src="app.js"></script>
</body></html>
