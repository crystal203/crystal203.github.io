<!doctype html>
<html lang="zh-CN">
<head><script>if(window===window.top){const p=new URLSearchParams(location.search);p.set('view','fx');location.replace('../../index.html#'+p);}</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>坎公特效</title><link rel="icon" href="../../../favicon.ico"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../../shared/theme.css"><link rel="stylesheet" href="../../shared/favorites.css"></head>
<body data-app="fx">
<header><button id="menu" class="mobile" aria-label="选择角色">☰</button><strong>坎公特效</strong><span id="current-character"></span><button id="info" title="资源信息" aria-label="资源信息">ⓘ</button></header>
<main>
<aside id="sidebar"><input id="search" type="search" placeholder="搜索角色" aria-label="搜索角色"><div id="characters" aria-label="角色列表"></div><small id="count"></small></aside>
<section class="workspace">
<div class="effect-bar"><label>模式 <select id="play-mode"><option value="module">攻击模组联动</option><option value="effect">单个特效素材</option></select></label><label id="module-choice">攻击模组 <select id="module"></select></label><label id="effect-choice" class="effect-choice">特效<select id="effect" aria-label="特效" disabled></select></label><span id="quality" hidden>近似</span><button id="all" disabled>全部播放</button></div>
<div id="character-controls" class="character-controls" hidden>

<label>朝向 <select id="direction" aria-label="人物朝向"><option value="right">向右</option><option value="left">向左</option><option value="front">正面</option><option value="back">背面</option></select></label>
<label>外观 <select id="appearance" aria-label="人物外观"></select></label>
<label>皮肤 <select id="skin" aria-label="人物皮肤"><option value="hana_5">hana_5</option></select></label>
<label>武器 <select id="weapon" aria-label="人物武器"></select></label>
<label title="目标型特效的演示距离；钩锁原生最大射程为 6">目标距离 <input id="target-distance" aria-label="目标距离" type="number" min="1" max="12" step=".25" value="6"></label>
<label><input id="show-target" type="checkbox" checked> 显示目标</label>
<small id="link-status" role="status"></small></div>
<div id="stage" class="checker"><canvas id="canvas" aria-label="特效画面" tabindex="0"></canvas><div id="export-region" hidden aria-label="导出范围"><i class="edge top" data-mode="move"></i><i class="edge right" data-mode="move"></i><i class="edge bottom" data-mode="move"></i><i class="edge left" data-mode="move"></i><i class="handle nw" data-mode="resize" data-dir="nw"></i><i class="handle n" data-mode="resize" data-dir="n"></i><i class="handle ne" data-mode="resize" data-dir="ne"></i><i class="handle e" data-mode="resize" data-dir="e"></i><i class="handle se" data-mode="resize" data-dir="se"></i><i class="handle s" data-mode="resize" data-dir="s"></i><i class="handle sw" data-mode="resize" data-dir="sw"></i><i class="handle w" data-mode="resize" data-dir="w"></i></div><div id="message" role="status">加载中</div></div>
<div class="transport"><button id="replay" aria-label="重播" title="重播" disabled>↺</button><button id="play" disabled>播放</button><button id="step" aria-label="下一帧" title="下一帧" disabled>▹│</button><label><input id="loop" type="checkbox" checked>循环</label><select id="speed" aria-label="速度"><option value=".25">0.25×</option><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select><button id="fit">适配</button><select id="preview-background" aria-label="预览背景"><option value="checker">棋盘背景</option><option value="color">纯色背景</option></select><input id="preview-color" type="color" value="#64615d" aria-label="预览背景颜色" hidden><input id="zoom" type="range" min=".25" max="6" step=".01" value="1" aria-label="缩放"></div>
<div class="timeline"><output id="time">0.000</output><input id="seek" type="range" min="0" max="1" step=".001" value="0" aria-label="播放时间"><output id="duration">0.000 s</output></div>
<div class="region-bar"><button id="region-select" type="button" aria-pressed="false" disabled>框选导出范围</button><button id="region-clear" type="button" hidden>取消框选</button><div id="region-settings" hidden><label>X <input id="region-x" aria-label="导出范围 X" type="number" min="0" step="1"></label><label>Y <input id="region-y" aria-label="导出范围 Y" type="number" min="0" step="1"></label><label>宽 <input id="region-w" aria-label="导出范围 宽" type="number" min="1" step="1"></label><label>高 <input id="region-h" aria-label="导出范围 高" type="number" min="1" step="1"></label></div><output id="region-dimensions" role="status"></output></div>
<div class="export-bar"><select id="media-format" aria-label="动画导出格式"><option value="gif">GIF</option><option value="mp4">MP4</option><option value="mov">MOV</option><option value="png">PNG 序列</option></select><select id="background" aria-label="背景"><option value="transparent">透明</option><option value="color">颜色幕布</option></select><input id="color" type="color" value="#00ff00" aria-label="幕布颜色" hidden><select id="size" aria-label="导出长边尺寸"><option value="native">原始尺寸</option><option value="256">256 px</option><option value="512" selected>512 px</option><option value="768">768 px</option><option value="1024">1024 px</option></select><label id="native-scale-label" hidden>倍率 <input id="native-scale" type="number" min=".25" max="8" step=".25" value="1" aria-label="原始尺寸倍率"></label><output id="native-dimensions" hidden aria-label="导出尺寸"></output><select id="fps" aria-label="GIF 帧率"><option value="15">15 fps</option><option value="20" selected>20 fps</option><option value="30">30 fps</option></select><button id="export" class="primary" disabled>导出 GIF</button><a id="download-gif" hidden download>保存 GIF</a><output id="export-status" role="status"></output><button id="cancel" hidden>取消</button><progress id="progress" max="1" value="0" hidden></progress></div>
<p style="font-size:12px;padding:0 12px;color:#9ba8ba">MP4/MOV：H.264、无音轨、无透明度，使用颜色幕布；PNG 序列 ZIP 保留完整透明度。使用上方尺寸、帧率与设置中的起止时间。框选后保留选区比例，固定尺寸为长边像素；可拖动边框移动、拖动手柄调整范围。</p><details class="options"><summary>设置</summary><div><label>起始 <input id="start" type="number" min="0" step=".01" value="0"> s</label><label>结束 <input id="end" type="number" min=".01" step=".01" value="1"> s</label><label title="用于预览中的自动粒子种子和技能随机；资源保存的固定粒子种子仍使用原值。">预览种子 <input id="seed" type="number" min="0" step="1" value="12345"></label><label>透明阈值 <input id="threshold" type="range" min="1" max="128" step="1" value="16"></label><label>视角 <select id="view"><option value="unity">Unity · 45°</option><option value="top">俯视</option></select></label><label><input id="grid" type="checkbox">网格</label></div><div id="layers" class="layers"></div></details>
</section></main>
<dialog id="info-dialog"><div class="dialog-head"><strong>资源信息</strong><button id="close-info" aria-label="关闭">×</button></div><pre id="info-text"></pre><button id="export-replay">导出复现数据</button></dialog>

</body></html>
